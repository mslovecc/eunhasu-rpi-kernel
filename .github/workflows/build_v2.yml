
name: Build Raspberry Pi 2 Kernel from Fedora 6.2.15 SRPM

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Parallel build jobs (0 = auto)"
        required: false
        default: "0"
        type: string

      verify_diretta_symbols:
        description: "Fail if Diretta imports are missing from Module.symvers"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: fedora-srpm-rpi2-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Fedora 6.2.15 / Raspberry Pi 2 / Diretta
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      RELEASE_TAG: "6.2.15"
      SRPM_NAME: "kernel-6.2.15-100.fc36.src.rpm"
      SOURCE_TARBALL: "linux-6.2.15.tar.xz"

      SRPM_SHA256: "f2f2fef31c54111720782b7867bc727d4f67866864a0e54c9dab9c606737f570"
      SOURCE_SHA256: "bc2d24c3a8bba92f92f3b480381fe7c80bb85d694fda656a1e030f55b926c766"

      SUPPORT_DIR: "sources/kernel-srpm"
      ABI_FRAGMENT: "config/rpi2-a20-preserved.fragment"

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --------------------------------------------------
      # 2. Install dependencies
      # --------------------------------------------------
      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            cpio \
            curl \
            device-tree-compiler \
            dwarves \
            flex \
            gcc-arm-linux-gnueabihf \
            git \
            kmod \
            libelf-dev \
            libssl-dev \
            make \
            patch \
            python3 \
            rpm \
            rsync \
            xz-utils \
            binutils-arm-linux-gnueabihf

          arm-linux-gnueabihf-gcc --version | head -n 1
          gcc --version | head -n 1

          echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 3. Validate repository files
      # --------------------------------------------------
      - name: Validate repository support files
        shell: bash
        run: |
          set -Eeuo pipefail

          for f in \
            "$SUPPORT_DIR/kernel.spec" \
            "$SUPPORT_DIR/patch-6.2-redhat.patch" \
            "$SUPPORT_DIR/kernel-armv7hl-fedora.config" \
            "$SUPPORT_DIR/SHA256SUMS" \
            "$ABI_FRAGMENT" \
            "modules/diretta/alsa_bridge.ko" \
            "modules/diretta/diretta_direct.ko"; do

            test -s "$f" || {
              echo "::error::Missing or empty file: $f"
              exit 1
            }
          done

          (
            cd "$SUPPORT_DIR"
            sha256sum --check SHA256SUMS
          )

          # Read original module vermagic.
          ALSA_VERMAGIC="$(modinfo -F vermagic modules/diretta/alsa_bridge.ko | xargs)"
          DIRECT_VERMAGIC="$(modinfo -F vermagic modules/diretta/diretta_direct.ko | xargs)"

          echo "ALSA vermagic: $ALSA_VERMAGIC"
          echo "Direct vermagic: $DIRECT_VERMAGIC"

          if [[ "$ALSA_VERMAGIC" != "$DIRECT_VERMAGIC" ]]; then
            echo "::error::Original Diretta modules have different vermagic."
            exit 1
          fi

          KERNEL_RELEASE="${ALSA_VERMAGIC%% *}"

          if [[ "$KERNEL_RELEASE" != 6.2.15-* ]]; then
            echo "::error::Original module release is not based on Linux 6.2.15."
            exit 1
          fi

          echo "EXPECTED_VERMAGIC=$ALSA_VERMAGIC" >> "$GITHUB_ENV"
          echo "KERNEL_RELEASE=$KERNEL_RELEASE" >> "$GITHUB_ENV"

          echo "Target kernel release: $KERNEL_RELEASE"

          # Check original modules are ARM ELF files.
          for module in modules/diretta/*.ko; do
            readelf -h "$module" | grep -q 'Class:.*ELF32'
            readelf -h "$module" | grep -q 'Machine:.*ARM'
          done

          mkdir -p .work/diretta

          for module in modules/diretta/*.ko; do
            name="$(basename "$module")"

            arm-linux-gnueabihf-nm -u "$module" 2>/dev/null \
              | awk '$1 == "U" {print $2}' \
              | sort -u \
              > ".work/diretta/$name.undefined"
          done

          sha256sum modules/diretta/*.ko

      # --------------------------------------------------
      # 4. Download Fedora SRPM and source archive
      # --------------------------------------------------
      - name: Download Fedora SRPM and Linux source
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p .work/downloads

          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"

          curl -fL --retry 5 --retry-all-errors \
            "$BASE_URL/$SRPM_NAME" \
            -o ".work/downloads/$SRPM_NAME"

          curl -fL --retry 5 --retry-all-errors \
            "$BASE_URL/$SOURCE_TARBALL" \
            -o ".work/downloads/$SOURCE_TARBALL"

          echo "$SRPM_SHA256  .work/downloads/$SRPM_NAME" \
            | sha256sum --check -

          echo "$SOURCE_SHA256  .work/downloads/$SOURCE_TARBALL" \
            | sha256sum --check -

          rpm -qp --qf '%{NAME} %{VERSION}-%{RELEASE}\n' \
            ".work/downloads/$SRPM_NAME" \
            | tee .work/srpm-identification.txt

          grep -qx 'kernel 6.2.15-100.fc36' \
            .work/srpm-identification.txt

      # --------------------------------------------------
      # 5. Extract SRPM
      # --------------------------------------------------
      - name: Extract and verify SRPM payload
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p .work/srpm-payload

          (
            cd .work/srpm-payload
            rpm2cpio "../downloads/$SRPM_NAME" | cpio -idm --quiet
          )

          SPEC="$(find .work/srpm-payload -name kernel.spec -type f -print -quit)"
          PATCH="$(find .work/srpm-payload -name patch-6.2-redhat.patch -type f -print -quit)"
          CONFIG="$(find .work/srpm-payload -name kernel-armv7hl-fedora.config -type f -print -quit)"

          test -n "$SPEC"
          test -n "$PATCH"
          test -n "$CONFIG"

          cmp "$SPEC" "$SUPPORT_DIR/kernel.spec"
          cmp "$PATCH" "$SUPPORT_DIR/patch-6.2-redhat.patch"
          cmp "$CONFIG" "$SUPPORT_DIR/kernel-armv7hl-fedora.config"

          echo "SRPM payload verified against repository support files."

      # --------------------------------------------------
      # 6. Extract Linux source
      # --------------------------------------------------
      - name: Extract Linux 6.2.15 source
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p .work/source

          tar -xJf ".work/downloads/$SOURCE_TARBALL" \
            -C .work/source

          SRC="$GITHUB_WORKSPACE/.work/source/linux-6.2.15"

          test -s "$SRC/Makefile"
          test -s "$SRC/arch/arm/configs/bcm2835_defconfig"
          test -s "$SRC/arch/arm/boot/dts/bcm2836-rpi-2-b.dts"

          VERSION="$(make -s -C "$SRC" ARCH=arm kernelversion)"

          if [[ "$VERSION" != "6.2.15" ]]; then
            echo "::error::Unexpected kernel source version: $VERSION"
            exit 1
          fi

          echo "SRC=$SRC" >> "$GITHUB_ENV"

          echo "Linux source version: $VERSION"

      # --------------------------------------------------
      # 7. Apply Fedora patch
      # --------------------------------------------------
      - name: Apply Fedora kernel patch
        shell: bash
        run: |
          set -Eeuo pipefail

          patch \
            --directory="$SRC" \
            --strip=1 \
            --forward \
            < .work/srpm-payload/patch-6.2-redhat.patch

          echo "Fedora patch applied."



      - name: Restore Fedora Makefile.rhelver
        shell: bash
        run: |
          set -Eeuo pipefail

          SUPPORT="$GITHUB_WORKSPACE/$SUPPORT_DIR"
          SRC="$SRC"

          echo "===== 1. Verify source files ====="

          test -d "$SUPPORT"
          test -d "$SRC"
          test -f "$SUPPORT/Makefile.rhelver"
          test -f "$SRC/Makefile"

          echo "Support file:"
          ls -lh "$SUPPORT/Makefile.rhelver"

          echo
          echo "===== 2. Verify repository manifest ====="

          if [[ -f "$SUPPORT/SHA256SUMS" ]]; then
            (
              cd "$SUPPORT"
              sha256sum -c SHA256SUMS
            )
          else
            echo "::warning::SHA256SUMS not found; skipping manifest verification."
          fi

          echo
          echo "===== 3. Install Makefile.rhelver ====="

          install -m 0644 \
            "$SUPPORT/Makefile.rhelver" \
            "$SRC/Makefile.rhelver"

          echo
          echo "===== 4. Verify installation ====="

          cmp \
            "$SUPPORT/Makefile.rhelver" \
            "$SRC/Makefile.rhelver"

          ls -lh "$SRC/Makefile.rhelver"
          sha256sum "$SRC/Makefile.rhelver"

          grep -n 'Makefile.rhelver' "$SRC/Makefile"

          echo "Makefile.rhelver restored successfully."

      # --------------------------------------------------
      # 8. Configure Raspberry Pi 2
      # --------------------------------------------------
      - name: Configure Raspberry Pi 2 kernel
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$SRC"

          # Start from upstream Raspberry Pi 2 / BCM2835 family config.
          make ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" \
            bcm2835_defconfig

          # Merge project ABI-sensitive settings.
          ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" \
            scripts/kconfig/merge_config.sh \
              -m -r \
              .config \
              "$GITHUB_WORKSPACE/$ABI_FRAGMENT"

          # Set the exact release suffix required by original Diretta modules.
          VERSION_PREFIX="6.2.15"
          LOCAL_SUFFIX="${KERNEL_RELEASE#${VERSION_PREFIX}}"

          if [[ -z "$LOCAL_SUFFIX" ]]; then
            echo "::error::Cannot derive kernel LOCALVERSION."
            exit 1
          fi

          scripts/config --file .config \
            --set-str LOCALVERSION "$LOCAL_SUFFIX" \
            --disable LOCALVERSION_AUTO \
            --enable ARCH_MULTI_V7 \
            --enable ARCH_BCM2835 \
            --enable CPU_V7 \
            --enable AEABI \
            --enable SMP \
            --enable PREEMPT \
            --enable MODULES \
            --enable MODULE_UNLOAD \
            --enable FRAME_POINTER \
            --disable PREEMPT_RT \
            --disable THUMB2_KERNEL \
            --enable BLK_DEV_INITRD \
            --enable DEVTMPFS \
            --enable DEVTMPFS_MOUNT \
            --enable MMC \
            --enable MMC_BLOCK \
            --enable MMC_BCM2835 \
            --enable USB \
            --enable USB_DWC2 \
            --enable USB_DWC2_HOST \
            --enable SERIAL_AMBA_PL011 \
            --enable SERIAL_AMBA_PL011_CONSOLE \
            --enable EXT4_FS \
            --module SQUASHFS \
            --module OVERLAY_FS \
            --module BLK_DEV_LOOP \
            --module SND \
            --module SND_PCM \
            --module SND_TIMER \
            --module SND_USB_AUDIO \
            --module SND_SOC

          make ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" \
            olddefconfig

          ACTUAL_RELEASE="$(make -s ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" kernelrelease)"

          if [[ "$ACTUAL_RELEASE" != "$KERNEL_RELEASE" ]]; then
            echo "::error::Kernel release mismatch."
            echo "Expected: $KERNEL_RELEASE"
            echo "Actual:   $ACTUAL_RELEASE"
            exit 1
          fi

          cp .config "$GITHUB_WORKSPACE/output-rpi2.config"

          echo "Kernel release verified: $ACTUAL_RELEASE"

      # --------------------------------------------------
      # 9. Build kernel
      # --------------------------------------------------
      - name: Build zImage modules and DTBs
        shell: bash
        env:
          BUILD_JOBS: ${{ inputs.jobs }}
        run: |
          set -Eeuo pipefail

          JOBS="$BUILD_JOBS"

          if [[ -z "$JOBS" || "$JOBS" == "0" ]]; then
            JOBS="$(nproc)"
          fi

          if ! [[ "$JOBS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid build job count."
            exit 1
          fi

          make -C "$SRC" \
            ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" \
            -j"$JOBS" \
            zImage modules dtbs

          test -s "$SRC/arch/arm/boot/zImage"
          test -s "$SRC/arch/arm/boot/dts/bcm2836-rpi-2-b.dtb"
          test -s "$SRC/Module.symvers"
          test -s "$SRC/System.map"

      # --------------------------------------------------
      # 10. Verify vermagic and symbol coverage
      # --------------------------------------------------
      - name: Verify Diretta compatibility metadata
        shell: bash
        env:
          VERIFY_SYMBOLS: ${{ inputs.verify_diretta_symbols }}
        run: |
          set -Eeuo pipefail

          SAMPLE_KO="$(find "$SRC" -type f -name '*.ko' -print -quit)"

          test -n "$SAMPLE_KO" || {
            echo "::error::No kernel module was produced."
            exit 1
          }

          BUILT_VERMAGIC="$(modinfo -F vermagic "$SAMPLE_KO" | xargs)"

          echo "Original vermagic: $EXPECTED_VERMAGIC"
          echo "Built vermagic:    $BUILT_VERMAGIC"

          if [[ "$BUILT_VERMAGIC" != "$EXPECTED_VERMAGIC" ]]; then
            echo "::error::Built kernel module vermagic mismatch."
            exit 1
          fi

          REPORT="$GITHUB_WORKSPACE/diretta-compatibility-report.txt"
          MISSING_TOTAL=0

          {
            echo "Diretta static compatibility report"
            echo "===================================="
            echo "Kernel release: $KERNEL_RELEASE"
            echo "Original vermagic: $EXPECTED_VERMAGIC"
            echo "Built vermagic: $BUILT_VERMAGIC"
            echo
            echo "This is a static metadata and symbol-name check."
            echo "It does not prove complete binary ABI compatibility."
            echo

            for MODULE in \
              modules/diretta/alsa_bridge.ko \
              modules/diretta/diretta_direct.ko; do

              NAME="$(basename "$MODULE")"
              SYMBOL_LIST=".work/diretta/$NAME.undefined"
              MISSING_FILE=".work/diretta/$NAME.missing"

              : > "$MISSING_FILE"

              while IFS= read -r SYMBOL; do
                [[ -n "$SYMBOL" ]] || continue

                if ! awk -v s="$SYMBOL" \
                  '$2 == s {found=1} END {exit !found}' \
                  "$SRC/Module.symvers"; then
                  echo "$SYMBOL" >> "$MISSING_FILE"
                fi
              done < "$SYMBOL_LIST"

              COUNT="$(wc -l < "$MISSING_FILE")"
              MISSING_TOTAL=$((MISSING_TOTAL + COUNT))

              echo "[$NAME]"
              echo "SHA256: $(sha256sum "$MODULE" | awk '{print $1}')"
              echo "Undefined symbols: $(wc -l < "$SYMBOL_LIST")"
              echo "Missing exported symbols: $COUNT"

              if [[ "$COUNT" -gt 0 ]]; then
                sed 's/^/MISSING: /' "$MISSING_FILE"
              fi

              echo
            done

            echo "Total missing symbols: $MISSING_TOTAL"

          } > "$REPORT"

          cat "$REPORT"

          if [[ "$VERIFY_SYMBOLS" == "true" && "$MISSING_TOTAL" -gt 0 ]]; then
            echo "::error::Diretta imports are missing from Module.symvers."
            exit 1
          fi

      # --------------------------------------------------
      # 11. Package
      # --------------------------------------------------
      - name: Package Raspberry Pi 2 kernel
        shell: bash
        run: |
          set -Eeuo pipefail

          PKG="$GITHUB_WORKSPACE/package"

          mkdir -p \
            "$PKG/boot/overlays" \
            "$PKG/lib/modules" \
            "$PKG/build-info"

          install -m 0644 \
            "$SRC/arch/arm/boot/zImage" \
            "$PKG/boot/kernel7.img"

          install -m 0644 \
            "$SRC/arch/arm/boot/dts/bcm2836-rpi-2-b.dtb" \
            "$PKG/boot/bcm2836-rpi-2-b.dtb"

          if compgen -G "$SRC/arch/arm/boot/dts/overlays/*.dtbo" > /dev/null; then
            cp "$SRC"/arch/arm/boot/dts/overlays/*.dtbo \
              "$PKG/boot/overlays/"
          fi

          if [[ -f "$SRC/arch/arm/boot/dts/overlays/README" ]]; then
            cp "$SRC/arch/arm/boot/dts/overlays/README" \
              "$PKG/boot/overlays/"
          fi

          make -C "$SRC" \
            ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" \
            INSTALL_MOD_PATH="$PKG" \
            modules_install

          rm -f \
            "$PKG/lib/modules/$KERNEL_RELEASE/build" \
            "$PKG/lib/modules/$KERNEL_RELEASE/source"

          depmod -b "$PKG" "$KERNEL_RELEASE"

          install -m 0644 "$SRC/.config" \
            "$PKG/build-info/rpi2.config"

          install -m 0644 "$SRC/System.map" \
            "$PKG/build-info/System.map"

          install -m 0644 "$SRC/Module.symvers" \
            "$PKG/build-info/Module.symvers"

          cp .work/srpm-identification.txt \
            "$PKG/build-info/"

          cp diretta-compatibility-report.txt \
            "$PKG/build-info/"

          cat > "$PKG/README.txt" <<EOF
          Raspberry Pi 2 Model B kernel package

          Kernel version: $KERNEL_RELEASE
          Source: Fedora 6.2.15 SRPM
          SRPM: $SRPM_NAME

          Kernel image:
          boot/kernel7.img

          Device tree:
          boot/bcm2836-rpi-2-b.dtb

          Kernel modules:
          lib/modules/$KERNEL_RELEASE/

          Build method:
          Fedora Linux 6.2.15 source archive
          Fedora patch-6.2-redhat.patch
          Raspberry Pi 2 bcm2835_defconfig
          Project A20 ABI configuration fragment

          IMPORTANT:
          This is not a byte-for-byte reproduction of the SOtM A20 kernel.
          Original Diretta modules are not modified.
          Static vermagic and symbol checks do not guarantee runtime ABI compatibility.
          Raspberry Pi boot firmware and root filesystem are not included.
          EOF

          tar -czf \
            "rpi2-kernel-$KERNEL_RELEASE.tar.gz" \
            -C "$GITHUB_WORKSPACE" package

          sha256sum \
            "rpi2-kernel-$KERNEL_RELEASE.tar.gz" \
            > "rpi2-kernel-$KERNEL_RELEASE.tar.gz.sha256"

      # --------------------------------------------------
      # 12. Upload artifacts
      # --------------------------------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpi2-kernel-${{ env.KERNEL_RELEASE }}
          if-no-files-found: error
          retention-days: 30
          path: |
            rpi2-kernel-${{ env.KERNEL_RELEASE }}.tar.gz
            rpi2-kernel-${{ env.KERNEL_RELEASE }}.tar.gz.sha256
            output-rpi2.config
            diretta-compatibility-report.txt
            package/README.txt
            package/build-info/**
