name: Validate RPi2 Diretta 6.2.15 config

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install config validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex make gcc libncurses-dev

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Fetch pinned upstream Linux 6.2.15
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC="$RUNNER_TEMP/linux"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/torvalds/linux.git
          git -C "$SRC" fetch --depth=1 origin 3c6c5ba197a9daf02c77ae39d65677c5e63e0845
          git -C "$SRC" checkout --detach FETCH_HEAD
          test "$(make -s -C "$SRC" ARCH=arm kernelversion)" = "6.2.15"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Resolve multi_v7_defconfig plus Diretta fragment
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$SRC"
          make ARCH=arm multi_v7_defconfig
          bash scripts/kconfig/merge_config.sh -m -r .config \
            "$GITHUB_WORKSPACE/config/rpi2-diretta-6.2.15.fragment"
          make ARCH=arm olddefconfig
          make ARCH=arm syncconfig

          cp .config "$GITHUB_WORKSPACE/rpi2-diretta-6.2.15.resolved.config"

          python3 - "$GITHUB_WORKSPACE/config/rpi2-diretta-6.2.15.fragment" .config <<'PY'
          import re, sys
          from pathlib import Path

          fragment = Path(sys.argv[1]).read_text().splitlines()
          final = {}
          for line in Path(sys.argv[2]).read_text().splitlines():
              line = line.strip()
              m = re.fullmatch(r"CONFIG_([A-Z0-9_]+)=(.*)", line)
              if m:
                  final[m.group(1)] = m.group(2)
              else:
                  m = re.fullmatch(r"# CONFIG_([A-Z0-9_]+) is not set", line)
                  if m:
                      final[m.group(1)] = "n"

          requested = {}
          for line in fragment:
              line = line.strip()
              m = re.fullmatch(r"CONFIG_([A-Z0-9_]+)=(.*)", line)
              if m:
                  requested[m.group(1)] = m.group(2)
              else:
                  m = re.fullmatch(r"# CONFIG_([A-Z0-9_]+) is not set", line)
                  if m:
                      requested[m.group(1)] = "n"

          mismatches = []
          for name, want in sorted(requested.items()):
              got = final.get(name, "<absent>")
              if got != want:
                  mismatches.append((name, want, got))

          print("Fragment options:", len(requested))
          print("Resolved options:", len(final))
          print("Mismatches:", len(mismatches))
          for name, want, got in mismatches:
              print(f"CONFIG_{name}: requested={want}, resolved={got}")

          required = {
              "ARCH_MULTI_V7": "y",
              "ARCH_BCM2835": "y",
              "CPU_V7": "y",
              "AEABI": "y",
              "SMP": "y",
              "PREEMPT": "y",
              "MODULES": "y",
              "MODULE_UNLOAD": "y",
              "MODVERSIONS": "n",
              "SND": "m",
              "SND_PCM": "m",
              "SND_USB_AUDIO": "m",
              "NET": "y",
              "PACKET": "y",
              "INET": "y",
              "USB": "y",
              "USB_DWC2": "y",
              "MMC": "y",
              "MMC_BLOCK": "m",
              "MMC_BCM2835": "y",
              "EXT4_FS": "y",
          }
          failed = []
          for name, want in required.items():
              got = final.get(name, "<absent>")
              print(f"REQUIRED CONFIG_{name}: expected={want}, actual={got}")
              if got != want:
                  failed.append((name, want, got))

          if mismatches or failed:
              print("CONFIG VALIDATION FAILED")
              sys.exit(1)
          print("CONFIG VALIDATION PASSED")
          PY

      - name: Upload resolved config and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpi2-diretta-6.2.15-config-validation
          path: |
            rpi2-diretta-6.2.15.resolved.config
          if-no-files-found: warn
