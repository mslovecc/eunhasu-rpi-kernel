name: Build Raspberry Pi 2B Kernel V8 (Fedora hardware config + Eunhasu Diretta ABI)

"on":
  push:
    branches:
      - v8-rpi2-fedora-config-base
    paths:
      - .github/workflows/build_v8.yml
      - config/v8-rpi2-diretta.fragment
  workflow_dispatch:
    inputs:
      jobs:
        description: "Parallel build jobs (0 = auto)"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: rpi2b-kernel-v8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux 6.2.15 / Fedora RPi2 config / Diretta V8
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      RELEASE_TAG: "6.2.15"
      SRPM_NAME: "kernel-6.2.15-100.fc36.src.rpm"
      SOURCE_TARBALL: "linux-6.2.15.tar.xz"
      SRPM_SHA256: "f2f2fef31c54111720782b7867bc727d4f67866864a0e54c9dab9c606737f570"
      SOURCE_SHA256: "bc2d24c3a8bba92f92f3b480381fe7c80bb85d694fda656a1e030f55b926c766"
      SUPPORT_DIR: "sources/kernel-srpm"
      FEDORA_DEVEL_RPM: "fedora-6.2.15-100/kernel-devel-6.2.15-100.fc36.armv7hl.rpm"
      A20_DEVEL_TARBALL: "baseline/a20/kernel-devel/kernel-devel-6.2.15-215.fc36.armv7hl.tar.gz"
      V8_FRAGMENT: "config/v8-rpi2-diretta.fragment"
      EXPECTED_KERNEL_RELEASE: "6.2.15-215.fc36.armv7hl"
      EXPECTED_VERMAGIC: "6.2.15-215.fc36.armv7hl SMP preempt mod_unload ARMv7 p2v8"

    steps:
      - name: Checkout V8 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build and audit dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ca-certificates cpio curl \
            device-tree-compiler dwarves flex gcc-arm-linux-gnueabihf \
            git kmod libelf-dev libssl-dev make patch python3 rpm rsync \
            xz-utils binutils-arm-linux-gnueabihf
          arm-linux-gnueabihf-gcc --version | sed -n '1p'
          echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> "$GITHUB_ENV"

      - name: Validate all fixed inputs and original Diretta modules
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in \
            "$V8_FRAGMENT" "$FEDORA_DEVEL_RPM" "$A20_DEVEL_TARBALL" \
            "$SUPPORT_DIR/kernel.spec" "$SUPPORT_DIR/patch-6.2-redhat.patch" \
            "$SUPPORT_DIR/SHA256SUMS" \
            modules/diretta/alsa_bridge.ko modules/diretta/diretta_direct.ko \
            rpi-boot/config.txt rpi-boot/cmdline.txt; do
            test -s "$f" || { echo "::error::Missing required input: $f"; exit 1; }
          done
          (cd "$SUPPORT_DIR" && sha256sum --check SHA256SUMS)
          echo "[Original Diretta module hashes]"
          sha256sum modules/diretta/alsa_bridge.ko modules/diretta/diretta_direct.ko
          A="$(modinfo -F vermagic modules/diretta/alsa_bridge.ko | xargs)"
          B="$(modinfo -F vermagic modules/diretta/diretta_direct.ko | xargs)"
          test "$A" = "$B"
          test "$A" = "$EXPECTED_VERMAGIC"
          for m in modules/diretta/alsa_bridge.ko modules/diretta/diretta_direct.ko; do
            readelf -h "$m" | grep -q 'Class:.*ELF32'
            readelf -h "$m" | grep -q 'Machine:.*ARM'
          done
          echo "EXPECTED_VERMAGIC=$A" >> "$GITHUB_ENV"

      - name: Audit the complete original Eunhasu A20 kernel-devel archive
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .work/a20-devel
          echo "A20 kernel-devel archive:"
          ls -lh "$A20_DEVEL_TARBALL"
          echo "d6eecd7e4b2db2cf98576357377225cb14b18674da32fca041c80882561e851b  $A20_DEVEL_TARBALL" | sha256sum --check
          sha256sum "$A20_DEVEL_TARBALL" | tee a20-kernel-devel-sha256.txt
          tar -tzf "$A20_DEVEL_TARBALL" > a20-kernel-devel-archive-list.txt
          tar -xzf "$A20_DEVEL_TARBALL" -C .work/a20-devel
          find .work/a20-devel -type f | sort > a20-kernel-devel-extracted-files.txt
          FILES="$(wc -l < a20-kernel-devel-extracted-files.txt)"
          echo "Extracted regular files: $FILES"
          test "$FILES" -gt 1000
          find .work/a20-devel -type f \( -name Module.symvers -o -name System.map -o -name utsrelease.h -o -name autoconf.h -o -name .config \) \
            | sort | tee a20-kernel-devel-key-files.txt
          SYMVERS="$(find .work/a20-devel -type f -name Module.symvers -print -quit)"
          test -n "$SYMVERS"
          for sym in __check_object_size fortify_panic page_address; do
            awk -v s="$sym" '$2==s && $1=="0x00000000" && $4=="EXPORT_SYMBOL" {ok=1} END{exit !ok}' "$SYMVERS" || {
              echo "::error::Original A20 Module.symvers lacks expected export $sym"
              exit 1
            }
          done
          echo "PASS: complete original A20 kernel-devel archive extracted and key ABI exports verified."

      - name: Extract Fedora 6.2.15-100 final ARMv7 configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .work/fedora-devel
          rpm -qp --qf '%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' "$FEDORA_DEVEL_RPM" \
            | tee fedora-devel-rpm-identification.txt
          grep -qx 'kernel-devel 6.2.15-100.fc36 armv7hl' fedora-devel-rpm-identification.txt
          (cd .work/fedora-devel && rpm2cpio "$GITHUB_WORKSPACE/$FEDORA_DEVEL_RPM" | cpio -idm --quiet)
          FEDORA_CONFIG="$(find .work/fedora-devel -type f -name .config -print -quit)"
          test -s "$FEDORA_CONFIG" || {
            echo "::error::The Fedora kernel-devel RPM does not contain its final .config."
            exit 1
          }
          install -m 0644 "$FEDORA_CONFIG" fedora-6.2.15-100-final.config
          grep -qx 'CONFIG_ARCH_BCM2835=y' fedora-6.2.15-100-final.config
          grep -qx 'CONFIG_NEON=y' fedora-6.2.15-100-final.config
          grep -qx 'CONFIG_VFP=y' fedora-6.2.15-100-final.config
          grep -qx 'CONFIG_USB_DWC2=m' fedora-6.2.15-100-final.config
          grep -qx 'CONFIG_USB_NET_SMSC95XX=m' fedora-6.2.15-100-final.config
          echo "Using the final .config extracted from the actual Fedora 6.2.15-100 ARMv7 kernel-devel RPM."

      - name: Download and verify Fedora kernel source and SRPM
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .work/downloads
          PRIMARY_URL="https://github.com/mslovecc/eunhasu-rpi-kernel/releases/download/$RELEASE_TAG"
          BACKUP_URL="https://s2.bravo123.top"
          download_verified() {
            local filename="$1" expected="$2" dest=".work/downloads/$1" url
            rm -f "$dest"
            for url in "$PRIMARY_URL/$filename" "$BACKUP_URL/$filename"; do
              echo "Trying $url"
              if curl -fL --connect-timeout 20 --max-time 1800 \
                  --retry 2 --retry-all-errors "$url" -o "$dest" &&
                  echo "$expected  $dest" | sha256sum --check --status; then
                echo "Verified $filename"
                return 0
              fi
              echo "::warning::Download/checksum failed from $url"
              rm -f "$dest"
            done
            echo "::error::Could not obtain verified $filename"
            return 1
          }
          download_verified "$SRPM_NAME" "$SRPM_SHA256"
          download_verified "$SOURCE_TARBALL" "$SOURCE_SHA256"
          rpm -qp --qf '%{NAME} %{VERSION}-%{RELEASE}\n' ".work/downloads/$SRPM_NAME" \
            | tee srpm-identification.txt
          grep -qx 'kernel 6.2.15-100.fc36' srpm-identification.txt
          mkdir -p .work/srpm-payload
          (cd .work/srpm-payload && rpm2cpio "../downloads/$SRPM_NAME" | cpio -idm --quiet)
          SPEC="$(find .work/srpm-payload -name kernel.spec -type f -print -quit)"
          PATCH="$(find .work/srpm-payload -name patch-6.2-redhat.patch -type f -print -quit)"
          RHELVER="$(find .work/srpm-payload -name Makefile.rhelver -type f -print -quit)"
          test -s "$SPEC" && test -s "$PATCH" && test -s "$RHELVER"
          cmp "$SPEC" "$SUPPORT_DIR/kernel.spec"
          cmp "$PATCH" "$SUPPORT_DIR/patch-6.2-redhat.patch"

      - name: Extract Linux 6.2.15 source and apply Fedora patchset
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .work/source
          tar -xJf ".work/downloads/$SOURCE_TARBALL" -C .work/source
          SRC="$GITHUB_WORKSPACE/.work/source/linux-6.2.15"
          test -s "$SRC/Makefile"
          test "$(make -s -C "$SRC" ARCH=arm kernelversion)" = "6.2.15"
          patch --directory="$SRC" --strip=1 --forward < .work/srpm-payload/patch-6.2-redhat.patch
          RHELVER="$(find .work/srpm-payload -name Makefile.rhelver -type f -print -quit)"
          install -m 0644 "$RHELVER" "$SRC/Makefile.rhelver"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Configure from Fedora final config plus minimal V8 overlays
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$SRC"
          cp "$GITHUB_WORKSPACE/fedora-6.2.15-100-final.config" .config
          make ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" olddefconfig
          bash scripts/kconfig/merge_config.sh -m -r .config \
            "$GITHUB_WORKSPACE/$V8_FRAGMENT"
          make ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" olddefconfig
          make ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" syncconfig
          cp .config "$GITHUB_WORKSPACE/output-rpi2b-v8.config"
          diff -u "$GITHUB_WORKSPACE/fedora-6.2.15-100-final.config" .config \
            > "$GITHUB_WORKSPACE/v8-vs-fedora-config.diff" || true

          # Required ABI and release gates.
          for option in \
            'CONFIG_SMP=y' 'CONFIG_PREEMPT=y' 'CONFIG_MODULES=y' \
            'CONFIG_MODULE_UNLOAD=y' 'CONFIG_HIGHMEM=y' \
            'CONFIG_HARDENED_USERCOPY=y' 'CONFIG_FORTIFY_SOURCE=y' \
            'CONFIG_LOCALVERSION="-215.fc36.armv7hl"'; do
            grep -Fqx "$option" .config || {
              echo "::error::Required V8 config not resolved: $option"
              exit 1
            }
          done
          grep -qx '# CONFIG_MODVERSIONS is not set' .config
          grep -qx '# CONFIG_LOCALVERSION_AUTO is not set' .config

          # Pi 2 SD-root must work without an initramfs.
          for option in \
            CONFIG_MMC CONFIG_MMC_BLOCK CONFIG_MMC_BCM2835 \
            CONFIG_MMC_SDHCI CONFIG_MMC_SDHCI_PLTFM CONFIG_MMC_SDHCI_IPROC \
            CONFIG_EXT4_FS CONFIG_MSDOS_PARTITION CONFIG_DEVTMPFS CONFIG_DEVTMPFS_MOUNT; do
            grep -qx "CONFIG_${option#CONFIG_}=y" .config || {
              echo "::error::Root boot option is not built-in: $option"
              exit 1
            }
          done

          # Do not silently lose the Fedora Pi 2 USB/network/audio baseline.
          for option in \
            CONFIG_ARCH_BCM2835 CONFIG_BCM2835_MBOX CONFIG_RASPBERRYPI_FIRMWARE \
            CONFIG_USB_DWC2 CONFIG_USB_DWC2_DUAL_ROLE CONFIG_USB_EHCI_HCD \
            CONFIG_USB_OHCI_HCD CONFIG_USB_NET_SMSC95XX CONFIG_USB_LAN78XX \
            CONFIG_USB_USBNET CONFIG_USB_STORAGE CONFIG_SND_USB_AUDIO; do
            grep -qE "^(CONFIG_${option#CONFIG_}=|# CONFIG_${option#CONFIG_} is not set$)" .config || {
              echo "::error::Fedora hardware option disappeared from final config: $option"
              exit 1
            }
          done
          grep -qx 'CONFIG_USB_DWC2=m' .config
          grep -qx 'CONFIG_USB_DWC2_DUAL_ROLE=y' .config
          grep -qx 'CONFIG_USB_EHCI_HCD=y' .config
          grep -qx 'CONFIG_USB_OHCI_HCD=m' .config
          grep -qx 'CONFIG_USB_NET_SMSC95XX=m' .config
          grep -qx 'CONFIG_USB_LAN78XX=m' .config
          grep -qx 'CONFIG_USB_USBNET=m' .config
          grep -qx 'CONFIG_USB_STORAGE=m' .config
          grep -qx 'CONFIG_SND_USB_AUDIO=m' .config

          ACTUAL_RELEASE="$(make -s ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" kernelrelease)"
          echo "Resolved kernelrelease: $ACTUAL_RELEASE"
          test "$ACTUAL_RELEASE" = "$EXPECTED_KERNEL_RELEASE"
          echo "KERNEL_RELEASE=$ACTUAL_RELEASE" >> "$GITHUB_ENV"

          {
            echo "V8 configuration provenance:"
            echo "Base: final .config extracted from Fedora kernel-devel-6.2.15-100.fc36.armv7hl.rpm"
            echo "Overlay: $V8_FRAGMENT"
            echo "Original ABI reference: $A20_DEVEL_TARBALL"
            echo "Kernel source: Linux 6.2.15 + Fedora SRPM patch-6.2-redhat.patch"
            echo
            echo "[Final required / hardware options]"
            grep -E '^(CONFIG_(ARCH_BCM2835|BCM2835_MBOX|RASPBERRYPI_FIRMWARE|SMP|PREEMPT|MODULES|MODULE_UNLOAD|HIGHMEM|HARDENED_USERCOPY|FORTIFY_SOURCE|MMC|MMC_BLOCK|MMC_BCM2835|MMC_SDHCI|MMC_SDHCI_PLTFM|MMC_SDHCI_IPROC|EXT4_FS|MSDOS_PARTITION|DEVTMPFS|DEVTMPFS_MOUNT|USB_DWC2|USB_DWC2_DUAL_ROLE|USB_EHCI_HCD|USB_OHCI_HCD|USB_NET_SMSC95XX|USB_LAN78XX|USB_USBNET|USB_STORAGE|SND_USB_AUDIO|NEON|VFP)=|# CONFIG_(MODVERSIONS|LOCALVERSION_AUTO) is not set)' .config || true
          } > "$GITHUB_WORKSPACE/rpi2b-v8-config-report.txt"

      - name: Build kernel, modules and device trees
        shell: bash
        env:
          BUILD_JOBS: ${{ inputs.jobs }}
        run: |
          set -Eeuo pipefail
          JOBS="$BUILD_JOBS"
          [[ -n "$JOBS" && "$JOBS" != "0" ]] || JOBS="$(nproc)"
          [[ "$JOBS" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid jobs: $JOBS"; exit 1; }
          make -C "$SRC" ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" -j"$JOBS" zImage modules dtbs
          test -s "$SRC/arch/arm/boot/zImage"
          test -s "$SRC/arch/arm/boot/dts/bcm2836-rpi-2-b.dtb"
          test -s "$SRC/Module.symvers"
          test -s "$SRC/System.map"
          test -s "$SRC/vmlinux"
          readelf -h "$SRC/vmlinux" | grep -q 'Machine:.*ARM'
          test -s "$SRC/drivers/mmc/host/bcm2835.o"
          test -s "$SRC/drivers/mmc/host/sdhci-iproc.o"
          find "$SRC" -type f -name '*.ko' | sed "s#^$SRC/##" | sort > rpi2b-v8-module-inventory.txt
          for module in dwc2 smsc95xx usb-storage snd-usb-audio; do
            find "$SRC" -type f -name "$module.ko" -print -quit | grep -q . || {
              echo "::error::Expected Fedora hardware module not built: $module"
              exit 1
            }
          done
          {
            echo "Built module files: $(wc -l < rpi2b-v8-module-inventory.txt)"
            echo
            echo "[Pi 2 critical modules]"
            grep -E '/(dwc2|smsc95xx|usbnet|usb-storage|snd-usb-audio)\.ko$' rpi2b-v8-module-inventory.txt || true
            echo
            echo "[SD host built-in objects]"
            ls -l "$SRC/drivers/mmc/host/bcm2835.o" "$SRC/drivers/mmc/host/sdhci-iproc.o"
          } | tee rpi2b-v8-driver-audit.txt

      - name: Verify target vermagic and mandatory Diretta exports
        shell: bash
        run: |
          set -Eeuo pipefail
          SAMPLE_KO="$(find "$SRC" -type f -name '*.ko' -print -quit)"
          test -n "$SAMPLE_KO"
          BUILT_VERMAGIC="$(modinfo -F vermagic "$SAMPLE_KO" | xargs)"
          echo "Expected: $EXPECTED_VERMAGIC"
          echo "Built:    $BUILT_VERMAGIC"
          test "$BUILT_VERMAGIC" = "$EXPECTED_VERMAGIC"

          for sym in __check_object_size fortify_panic page_address; do
            awk -v s="$sym" '$2==s && $1=="0x00000000" && $4=="EXPORT_SYMBOL" {ok=1} END{exit !ok}' "$SRC/Module.symvers" || {
              echo "::error::Required original Eunhasu ABI export absent or changed: $sym"
              exit 1
            }
          done

          mkdir -p .work/diretta
          for module in modules/diretta/alsa_bridge.ko modules/diretta/diretta_direct.ko; do
            name="$(basename "$module")"
            arm-linux-gnueabihf-nm -u "$module" 2>/dev/null \
              | awk '$1=="U" {print $2}' | sort -u > ".work/diretta/$name.imports"
            comm -23 ".work/diretta/$name.imports" \
              <(awk 'NF>=2 {print $2}' "$SRC/Module.symvers" | sort -u) \
              > ".work/diretta/$name.missing-kernel"
          done
          {
            echo "V8 static Diretta ABI report"
            echo "Kernel release: $KERNEL_RELEASE"
            echo "Expected vermagic: $EXPECTED_VERMAGIC"
            echo "Built vermagic: $BUILT_VERMAGIC"
            echo "CONFIG_MODVERSIONS: disabled"
            echo
            echo "[Required A20 exports]"
            grep -E ' (__)??(check_object_size|fortify_panic|page_address) ' "$SRC/Module.symvers" || true
            echo
            echo "[Original module imports]"
            for name in alsa_bridge.ko diretta_direct.ko; do
              echo "$name imports: $(wc -l < ".work/diretta/$name.imports")"
              echo "$name missing from kernel Module.symvers: $(wc -l < ".work/diretta/$name.missing-kernel")"
              if test -s ".work/diretta/$name.missing-kernel"; then
                sed 's/^/  /' ".work/diretta/$name.missing-kernel"
              fi
            done
            echo
            echo "NOTE: missing symbol-name matches are reported, not treated as a full ABI verdict."
            echo "NOTE: CONFIG_MODVERSIONS is disabled; runtime module loading is still required."
          } | tee diretta-v8-static-audit.txt

      - name: Package V8 kernel, explicit Pi 2 DTB and matching modules
        shell: bash
        run: |
          set -Eeuo pipefail
          PKG="$GITHUB_WORKSPACE/package"
          MODDIR="$PKG/lib/modules/$KERNEL_RELEASE"
          mkdir -p "$PKG/boot" "$MODDIR/extra/diretta" "$PKG/build-info"

          install -m 0644 "$SRC/arch/arm/boot/zImage" "$PKG/boot/kernel7.img"
          install -m 0644 "$SRC/arch/arm/boot/dts/bcm2836-rpi-2-b.dtb" "$PKG/boot/bcm2836-rpi-2-b.dtb"

          # Use the repository's existing boot settings, but explicitly select
          # the audited Fedora-compatible DTB and disable the stale initramfs.
          python3 - "$GITHUB_WORKSPACE/rpi-boot/config.txt" "$PKG/boot/config.txt" <<'PY'
          import sys
          from pathlib import Path
          src, dst = map(Path, sys.argv[1:])
          lines = src.read_text().splitlines()
          out = []
          for line in lines:
              s = line.strip()
              if s.startswith("auto_initramfs=") or s.startswith("device_tree="):
                  continue
              out.append(line)
          out += ["", "[all]", "device_tree=bcm2836-rpi-2-b.dtb", "auto_initramfs=0", ""]
          dst.write_text("\n".join(out))
          PY
          install -m 0644 rpi-boot/cmdline.txt "$PKG/boot/cmdline.txt"

          make -C "$SRC" ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" \
            INSTALL_MOD_PATH="$PKG" modules_install
          install -m 0644 modules/diretta/alsa_bridge.ko "$MODDIR/extra/diretta/"
          install -m 0644 modules/diretta/diretta_direct.ko "$MODDIR/extra/diretta/"
          depmod -b "$PKG" "$KERNEL_RELEASE"
          test -s "$MODDIR/modules.dep"
          test -s "$MODDIR/modules.alias"
          find "$MODDIR" -type f \( -name 'dwc2.ko' -o -name 'dwc2.ko.xz' -o -name 'dwc2.ko.zst' \) -print -quit | grep -q .
          find "$MODDIR" -type f \( -name 'smsc95xx.ko' -o -name 'smsc95xx.ko.xz' -o -name 'smsc95xx.ko.zst' \) -print -quit | grep -q .

          # Verify that the selected DTB describes the Pi 2 LAN9514 USB topology.
          dtc -I dtb -O dts -o "$PKG/build-info/bcm2836-rpi-2-b.dts" "$PKG/boot/bcm2836-rpi-2-b.dtb"
          grep -q 'brcm,bcm2835-usb' "$PKG/build-info/bcm2836-rpi-2-b.dts"
          grep -q 'usb424,9514' "$PKG/build-info/bcm2836-rpi-2-b.dts"
          grep -q 'usb424,ec00' "$PKG/build-info/bcm2836-rpi-2-b.dts"

          install -m 0644 "$SRC/.config" "$PKG/build-info/v8-final.config"
          install -m 0644 "$SRC/Module.symvers" "$PKG/build-info/Module.symvers"
          install -m 0644 "$SRC/System.map" "$PKG/build-info/System.map"
          install -m 0644 "$GITHUB_WORKSPACE/fedora-6.2.15-100-final.config" "$PKG/build-info/"
          install -m 0644 "$GITHUB_WORKSPACE/$V8_FRAGMENT" "$PKG/build-info/"
          cp "$GITHUB_WORKSPACE/a20-kernel-devel-sha256.txt" "$PKG/build-info/"
          cp "$GITHUB_WORKSPACE/a20-kernel-devel-key-files.txt" "$PKG/build-info/"
          cp "$GITHUB_WORKSPACE/fedora-devel-rpm-identification.txt" "$PKG/build-info/"
          cp "$GITHUB_WORKSPACE/srpm-identification.txt" "$PKG/build-info/"
          cp "$GITHUB_WORKSPACE/rpi2b-v8-config-report.txt" "$PKG/build-info/"
          cp "$GITHUB_WORKSPACE/rpi2b-v8-driver-audit.txt" "$PKG/build-info/"
          cp "$GITHUB_WORKSPACE/rpi2b-v8-module-inventory.txt" "$PKG/build-info/"
          cp "$GITHUB_WORKSPACE/diretta-v8-static-audit.txt" "$PKG/build-info/"

          cat > "$PKG/README.txt" <<EOF
          Raspberry Pi 2 Model B / Eunhasu Diretta kernel V8
          Kernel release: $KERNEL_RELEASE
          Base config: final Fedora kernel-devel-6.2.15-100 ARMv7 .config
          ABI overlay: $V8_FRAGMENT
          Kernel source: Linux 6.2.15 + Fedora 6.2 SRPM patch
          Boot image: boot/kernel7.img
          Explicit DTB: boot/bcm2836-rpi-2-b.dtb
          Boot config: boot/config.txt (explicit DTB, auto_initramfs=0)
          Command line: boot/cmdline.txt (copied unchanged from rpi-boot)
          Modules: lib/modules/$KERNEL_RELEASE/
          Original Diretta modules:
            extra/diretta/alsa_bridge.ko
            extra/diretta/diretta_direct.ko

          This package intentionally does not include the old initramfs7.
          The SD controller, partition parser and ext4 root filesystem are
          required to be built into this kernel. The boot config disables
          automatic loading of the old initramfs whose embedded modules were
          built for a different kernel release.
          
          Hardware configuration is based on the final Fedora 6.2.15-100
          ARMv7 kernel-devel config known to boot Raspberry Pi 2. The Diretta
          ABI overlay changes only release/preemption/module ABI and the
          built-in SD-root requirements. Fedora USB/DWC2/SMSC95XX and USB
          audio settings are retained and audited.
          
          Static vermagic and symbol checks do not prove complete binary ABI.
          Runtime boot and original Diretta module loading must be tested.
          EOF

          # Hash every deployable file to make SD-card installation auditable.
          (cd "$PKG" && find boot lib -type f -print0 | sort -z | xargs -0 sha256sum) \
            > "$PKG/build-info/PACKAGE-SHA256SUMS.txt"
          cd "$GITHUB_WORKSPACE"
          tar -czf "rpi2b-kernel-$KERNEL_RELEASE-v8.tar.gz" package
          sha256sum "rpi2b-kernel-$KERNEL_RELEASE-v8.tar.gz" \
            > "rpi2b-kernel-$KERNEL_RELEASE-v8.tar.gz.sha256"
          ls -lh "rpi2b-kernel-$KERNEL_RELEASE-v8.tar.gz" \
            "rpi2b-kernel-$KERNEL_RELEASE-v8.tar.gz.sha256"

      - name: Upload V8 package and full audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: rpi2b-kernel-${{ env.EXPECTED_KERNEL_RELEASE }}-v8
          if-no-files-found: error
          retention-days: 30
          path: |
            rpi2b-kernel-${{ env.EXPECTED_KERNEL_RELEASE }}-v8.tar.gz
            rpi2b-kernel-${{ env.EXPECTED_KERNEL_RELEASE }}-v8.tar.gz.sha256
            output-rpi2b-v8.config
            v8-vs-fedora-config.diff
            fedora-6.2.15-100-final.config
            fedora-devel-rpm-identification.txt
            a20-kernel-devel-sha256.txt
            a20-kernel-devel-archive-list.txt
            a20-kernel-devel-extracted-files.txt
            a20-kernel-devel-key-files.txt
            srpm-identification.txt
            rpi2b-v8-config-report.txt
            rpi2b-v8-driver-audit.txt
            rpi2b-v8-module-inventory.txt
            diretta-v8-static-audit.txt
            package/README.txt
            package/boot/**
            package/build-info/**
