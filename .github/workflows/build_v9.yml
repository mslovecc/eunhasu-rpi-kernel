name: Build Raspberry Pi 2B Fedora 36 kernel V9 (bcm2709 + Fedora 6.2.15 + Diretta)

"on":
  workflow_dispatch:
    inputs:
      jobs:
        description: "Parallel build jobs (0 = automatically detect)"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: rpi2b-fedora36-diretta-v9-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Fedora 36 Linux 6.2.15 / bcm2709 / Diretta ABI V9
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      RELEASE_TAG: "6.2.15"
      SRPM_NAME: "kernel-6.2.15-100.fc36.src.rpm"
      SOURCE_TARBALL: "linux-6.2.15.tar.xz"
      SRPM_SHA256: "f2f2fef31c54111720782b7867bc727d4f67866864a0e54c9dab9c606737f570"
      SOURCE_SHA256: "bc2d24c3a8bba92f92f3b480381fe7c80bb85d694fda656a1e030f55b926c766"
      SUPPORT_DIR: "sources/kernel-srpm"
      HARDWARE_CONFIG: "config/bcm2709_defconfig"
      ABI_FRAGMENT: "config/v9-rpi2b-diretta.fragment"
      A20_DEVEL_TARBALL: "baseline/a20/kernel-devel/kernel-devel-6.2.15-215.fc36.armv7hl.tar.gz"
      A20_DEVEL_SHA256: "d6eecd7e4b2db2cf98576357377225cb14b18674da32fca041c80882561e851b"
      EXPECTED_KERNEL_RELEASE: "6.2.15-215.fc36.armv7hl"
      EXPECTED_VERMAGIC: "6.2.15-215.fc36.armv7hl SMP preempt mod_unload ARMv7 p2v8"

    steps:
      - name: Checkout V9 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install ARM cross-build and packaging dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ca-certificates cpio curl \
            device-tree-compiler dwarves flex gcc-arm-linux-gnueabihf git kmod \
            libelf-dev libssl-dev make patch python3 rpm rsync xz-utils gzip \
            binutils-arm-linux-gnueabihf
          arm-linux-gnueabihf-gcc --version | head -n1
          echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> "$GITHUB_ENV"

      - name: Validate hardware config and original Diretta modules
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in "$HARDWARE_CONFIG" "$ABI_FRAGMENT" \
            "$SUPPORT_DIR/kernel.spec" "$SUPPORT_DIR/patch-6.2-redhat.patch" \
            "$SUPPORT_DIR/Makefile.rhelver" "$SUPPORT_DIR/SHA256SUMS" \
            modules/diretta/SHA256SUMS modules/diretta/alsa_bridge.ko \
            modules/diretta/diretta_direct.ko rpi-boot/config.txt rpi-boot/cmdline.txt \\
            "$A20_DEVEL_TARBALL"; do
            test -s "$f" || { echo "::error::Missing required input: $f"; exit 1; }
          done
          (cd "$SUPPORT_DIR" && sha256sum --check SHA256SUMS)
          (cd modules/diretta && sha256sum --check SHA256SUMS)

          for m in modules/diretta/alsa_bridge.ko modules/diretta/diretta_direct.ko; do
            vm="$(modinfo -F vermagic "$m" | xargs)"
            [[ "$vm" == "$EXPECTED_VERMAGIC" ]] || {
              echo "::error::Unexpected original vermagic in $m"
              echo "Expected: $EXPECTED_VERMAGIC"
              echo "Actual: $vm"
              exit 1
            }
            readelf -h "$m" | grep -q 'Class:.*ELF32'
            readelf -h "$m" | grep -q 'Machine:.*ARM'
            modinfo "$m"
            sha256sum "$m"
          done

          mkdir -p .work/diretta
          for m in modules/diretta/alsa_bridge.ko modules/diretta/diretta_direct.ko; do
            arm-linux-gnueabihf-nm -u "$m" 2>/dev/null \
              | awk '$1 == "U" {print $2}' | sort -u \
              > ".work/diretta/$(basename "$m").imports"
          done

      - name: Verify the original 6.2.15-215 Diretta ABI reference
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .work/a20-devel
          echo "$A20_DEVEL_SHA256  $A20_DEVEL_TARBALL" | sha256sum --check
          tar -xzf "$A20_DEVEL_TARBALL" -C .work/a20-devel
          original_symvers="$(find .work/a20-devel -type f -name Module.symvers -print -quit)"
          test -s "$original_symvers"
          install -m 0644 "$original_symvers" a20-original-Module.symvers
          for sym in __check_object_size fortify_panic page_address; do
            awk -v s="$sym" '$2 == s && $1 == "0x00000000" && $4 == "EXPORT_SYMBOL" {ok=1} END {exit !ok}' "$original_symvers" || {
              echo "::error::Original 6.2.15-215 Module.symvers does not match required export: $sym"
              grep -w "$sym" "$original_symvers" || true
              exit 1
            }
          done
          echo "Original 6.2.15-215 Module.symvers confirms all three zero-CRC EXPORT_SYMBOL entries."

      - name: Download and verify Fedora 6.2.15 SRPM and source tarball
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .work/downloads
          primary="https://github.com/mslovecc/eunhasu-rpi-kernel/releases/download/$RELEASE_TAG"
          backup="https://s2.bravo123.top"

          download_verified() {
            local filename="$1" expected="$2" dest=".work/downloads/$1" url
            rm -f "$dest"
            for url in "$primary/$filename" "$backup/$filename"; do
              echo "Trying $url"
              if curl -fL --connect-timeout 20 --max-time 1800 \
                  --retry 2 --retry-all-errors "$url" -o "$dest" \
                  && echo "$expected  $dest" | sha256sum --check --status; then
                echo "Verified $filename"
                return 0
              fi
              echo "::warning::Download/checksum failed: $url"
              rm -f "$dest"
            done
            echo "::error::Could not obtain verified $filename"
            return 1
          }

          download_verified "$SRPM_NAME" "$SRPM_SHA256"
          download_verified "$SOURCE_TARBALL" "$SOURCE_SHA256"
          rpm -qp --qf '%{NAME} %{VERSION}-%{RELEASE}\n' ".work/downloads/$SRPM_NAME" \
            | tee srpm-identification.txt
          grep -qx 'kernel 6.2.15-100.fc36' srpm-identification.txt

          mkdir -p .work/srpm-payload
          (cd .work/srpm-payload && rpm2cpio "../downloads/$SRPM_NAME" | cpio -idm --quiet)
          spec="$(find .work/srpm-payload -type f -name kernel.spec -print -quit)"
          patchfile="$(find .work/srpm-payload -type f -name patch-6.2-redhat.patch -print -quit)"
          rhelver="$(find .work/srpm-payload -type f -name Makefile.rhelver -print -quit)"
          test -s "$spec" && test -s "$patchfile" && test -s "$rhelver"
          cmp "$spec" "$SUPPORT_DIR/kernel.spec"
          cmp "$patchfile" "$SUPPORT_DIR/patch-6.2-redhat.patch"
          cmp "$rhelver" "$SUPPORT_DIR/Makefile.rhelver"

          {
            echo "Fedora SRPM: $SRPM_NAME"
            echo "SRPM SHA256: $SRPM_SHA256"
            echo "Linux source: $SOURCE_TARBALL"
            echo "Source SHA256: $SOURCE_SHA256"
            echo "Spec, Fedora patch and Makefile.rhelver match repository copies."
          } | tee fedora-source-provenance.txt

      - name: Extract Fedora Linux 6.2.15 source and apply Fedora patch
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .work/source
          tar -xJf ".work/downloads/$SOURCE_TARBALL" -C .work/source
          SRC="$GITHUB_WORKSPACE/.work/source/linux-6.2.15"
          test -s "$SRC/Makefile"
          test "$(make -s -C "$SRC" ARCH=arm kernelversion)" = "6.2.15"
          patch --directory="$SRC" --strip=1 --forward \
            < .work/srpm-payload/patch-6.2-redhat.patch
          install -m 0644 .work/srpm-payload/Makefile.rhelver "$SRC/Makefile.rhelver"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Configure from bcm2709_defconfig plus V9 ABI and boot fragment
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$SRC"

          # V9 starts from the repository's bcm2709_defconfig, not Fedora's
          # kernel-devel .config and not the previous V8 configuration.
          install -m 0644 "$GITHUB_WORKSPACE/$HARDWARE_CONFIG" .config
          make ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" olddefconfig
          bash scripts/kconfig/merge_config.sh -m -r .config \
            "$GITHUB_WORKSPACE/$ABI_FRAGMENT"

          # Explicitly turn off non-RPi2 GPU, NVMe, SAS/HBA and foreign
          # architecture compression drivers; retain RPi VC4 and USB audio.
          for opt in DRM_AMDGPU DRM_NOUVEAU DRM_RADEON DRM_I915 DRM_XE \
            DRM_GMA500 DRM_VMWGFX DRM_VBOXVIDEO DRM_QXL DRM_BOCHS DRM_VIRTIO_GPU \
            BLK_DEV_NVME NVME_CORE NVME_FC NVME_RDMA NVME_TCP NVME_TARGET \
            SCSI_MPI3MR SCSI_QLA_FC SCSI_QLOGIC_1280 SCSI_HPSA \
            MEGARAID_SAS MPT2SAS MPT3SAS SMARTPQI SCSI_ISCI \
            XZ_DEC_X86 XZ_DEC_POWERPC XZ_DEC_IA64 XZ_DEC_SPARC; do
            scripts/config --file .config --disable "$opt"
          done

          make ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" olddefconfig
          make ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" syncconfig
          cp .config "$GITHUB_WORKSPACE/output-v9-rpi2b.config"
          diff -u "$GITHUB_WORKSPACE/$HARDWARE_CONFIG" .config \
            > "$GITHUB_WORKSPACE/v9-vs-bcm2709-defconfig.diff" || true

          require_config() {
            grep -Fqx "$1" .config || {
              echo "::error::Required config missing after Kconfig resolution: $1"
              exit 1
            }
          }

          for option in \
            'CONFIG_ARCH_BCM2835=y' 'CONFIG_CPU_V7=y' 'CONFIG_AEABI=y' \
            'CONFIG_ARM_PATCH_PHYS_VIRT=y' 'CONFIG_NEON=y' \
            'CONFIG_KERNEL_MODE_NEON=y' 'CONFIG_SMP=y' 'CONFIG_PREEMPT=y' \
            'CONFIG_MODULES=y' 'CONFIG_MODULE_UNLOAD=y' 'CONFIG_HIGHMEM=y' \
            'CONFIG_HARDENED_USERCOPY=y' 'CONFIG_FORTIFY_SOURCE=y' \
            'CONFIG_BLK_DEV_INITRD=y' 'CONFIG_DEVTMPFS=y' \
            'CONFIG_DEVTMPFS_MOUNT=y' 'CONFIG_MSDOS_PARTITION=y' \
            'CONFIG_EXT4_FS=y' 'CONFIG_MMC=y' 'CONFIG_MMC_BLOCK=y' \
            'CONFIG_MMC_BCM2835=y' 'CONFIG_SERIAL_AMBA_PL011=y' \
            'CONFIG_SERIAL_AMBA_PL011_CONSOLE=y' 'CONFIG_USB=y' \
            'CONFIG_SND=m' 'CONFIG_SND_PCM=m' 'CONFIG_SND_TIMER=m' \
            'CONFIG_SND_USB_AUDIO=m'; do
            require_config "$option"
          done

          for option in '# CONFIG_MODVERSIONS is not set' \
            '# CONFIG_MODULE_SIG is not set' '# CONFIG_MODULE_SIG_FORCE is not set' \
            '# CONFIG_MODULE_SIG_ALL is not set' '# CONFIG_THUMB2_KERNEL is not set' \
            '# CONFIG_PREEMPT_RT is not set' '# CONFIG_LOCALVERSION_AUTO is not set'; do
            require_config "$option"
          done
          require_config 'CONFIG_LOCALVERSION="-215.fc36.armv7hl"'

          for option in CONFIG_USB_DWC2 CONFIG_USB_NET_SMSC95XX CONFIG_USB_USBNET \
            CONFIG_USB_STORAGE CONFIG_SND_USB_AUDIO; do
            grep -Eq "^$option=(m|y)$" .config || {
              echo "::error::Required RPi2 peripheral option not enabled: $option"
              exit 1
            }
          done

          forbidden='DRM_AMDGPU|DRM_NOUVEAU|DRM_RADEON|DRM_I915|DRM_XE|DRM_GMA500|DRM_VMWGFX|DRM_VBOXVIDEO|DRM_QXL|DRM_BOCHS|DRM_VIRTIO_GPU|BLK_DEV_NVME|NVME_CORE|NVME_FC|NVME_RDMA|NVME_TCP|NVME_TARGET|SCSI_MPI3MR|SCSI_QLA_FC|SCSI_QLOGIC_1280|SCSI_HPSA|MEGARAID_SAS|MPT2SAS|MPT3SAS|SMARTPQI|SCSI_ISCI'
          if grep -E "^CONFIG_($forbidden)=(y|m)$" .config; then
            echo "::error::A forbidden non-RPi2 driver remains enabled."
            exit 1
          fi
          if grep -Eq '^CONFIG_X86(_[A-Z0-9_]+)?=(y|m)$' .config; then
            echo "::error::An x86 architecture option remains enabled in this ARM build."
            exit 1
          fi

          release="$(make -s ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" kernelrelease)"
          echo "Resolved kernelrelease: $release"
          [[ "$release" == "$EXPECTED_KERNEL_RELEASE" ]] || {
            echo "::error::Kernel release mismatch: $release"
            exit 1
          }
          echo "KERNEL_RELEASE=$release" >> "$GITHUB_ENV"

          {
            echo "V9 hardware base: $HARDWARE_CONFIG"
            echo "Fedora source: Linux 6.2.15 + SRPM patch-6.2-redhat.patch"
            echo "ABI fragment: $ABI_FRAGMENT"
            echo "Kernel release: $release"
            echo
            echo "[ABI and boot options]"
            grep -E '^(CONFIG_(LOCALVERSION|ARCH_BCM2835|CPU_V7|AEABI|ARM_PATCH_PHYS_VIRT|NEON|KERNEL_MODE_NEON|SMP|PREEMPT|MODULES|MODULE_UNLOAD|HIGHMEM|HARDENED_USERCOPY|FORTIFY_SOURCE|BLK_DEV_INITRD|DEVTMPFS|DEVTMPFS_MOUNT|MSDOS_PARTITION|EXT4_FS|MMC|MMC_BLOCK|MMC_BCM2835|USB_DWC2|USB_NET_SMSC95XX|USB_USBNET|USB_STORAGE|SND|SND_PCM|SND_TIMER|SND_USB_AUDIO)=|# CONFIG_(MODVERSIONS|MODULE_SIG|MODULE_SIG_FORCE|MODULE_SIG_ALL|THUMB2_KERNEL|PREEMPT_RT|LOCALVERSION_AUTO) is not set)' .config || true
            echo
            echo "[Forbidden driver disable results]"
            grep -E "^# CONFIG_($forbidden) is not set$" .config || true
          } > "$GITHUB_WORKSPACE/v9-config-audit.txt"

      - name: Build zImage, modules and Raspberry Pi 2 device tree
        shell: bash
        env:
          BUILD_JOBS: ${{ inputs.jobs }}
        run: |
          set -Eeuo pipefail
          jobs="$BUILD_JOBS"
          [[ -n "$jobs" && "$jobs" != "0" ]] || jobs="$(nproc)"
          [[ "$jobs" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Invalid build jobs: $jobs"
            exit 1
          }

          make -C "$SRC" ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" \
            -j"$jobs" zImage modules dtbs

          test -s "$SRC/arch/arm/boot/zImage"
          test -s "$SRC/arch/arm/boot/dts/bcm2836-rpi-2-b.dtb"
          test -s "$SRC/Module.symvers"
          test -s "$SRC/System.map"
          test -s "$SRC/vmlinux"
          readelf -h "$SRC/vmlinux" | grep -q 'Machine:.*ARM'

          for opt in DRM_AMDGPU DRM_NOUVEAU DRM_RADEON DRM_I915 DRM_XE \
            BLK_DEV_NVME NVME_CORE SCSI_MPI3MR; do
            if grep -Eq "^CONFIG_$opt=(y|m)$" "$SRC/.config"; then
              echo "::error::Forbidden driver enabled: CONFIG_$opt"
              exit 1
            fi
          done

          find "$SRC" -type f -name '*.ko' -print \
            | sed "s#^$SRC/##" | sort > "$GITHUB_WORKSPACE/v9-module-inventory.txt"
          {
            echo "Built module count: $(wc -l < "$GITHUB_WORKSPACE/v9-module-inventory.txt")"
            echo
            echo "[RPi2 USB / network / audio modules]"
            grep -E '/(dwc2|smsc95xx|usbnet|usb-storage|snd-usb-audio)\.ko$' \
              "$GITHUB_WORKSPACE/v9-module-inventory.txt" || true
          } | tee "$GITHUB_WORKSPACE/v9-driver-audit.txt"

      - name: Verify exact vermagic and mandatory zero-CRC exports
        shell: bash
        run: |
          set -Eeuo pipefail
          sample="$(find "$SRC" -type f -name '*.ko' -print -quit)"
          test -n "$sample"
          built_vermagic="$(modinfo -F vermagic "$sample" | xargs)"
          [[ "$built_vermagic" == "$EXPECTED_VERMAGIC" ]] || {
            echo "::error::Built module vermagic mismatch."
            echo "Expected: $EXPECTED_VERMAGIC"
            echo "Actual: $built_vermagic"
            exit 1
          }
          grep -qx '# CONFIG_MODVERSIONS is not set' "$SRC/.config"

          for sym in __check_object_size fortify_panic page_address; do
            awk -v s="$sym" \
              '$2 == s && $1 == "0x00000000" && $4 == "EXPORT_SYMBOL" {ok=1} END {exit !ok}' \
              "$SRC/Module.symvers" || {
                echo "::error::Required zero-CRC EXPORT_SYMBOL missing: $sym"
                grep -w "$sym" "$SRC/Module.symvers" || true
                exit 1
              }
          done

          missing_total=0
          {
            echo "V9 Diretta static ABI report"
            echo "Kernel release: $KERNEL_RELEASE"
            echo "Built module vermagic: $built_vermagic"
            echo "CONFIG_MODVERSIONS: disabled"
            echo
            echo "[Mandatory exports]"
            for sym in __check_object_size fortify_panic page_address; do
              awk -v s="$sym" '$2 == s {print}' "$SRC/Module.symvers"
            done
            echo
            for name in alsa_bridge.ko diretta_direct.ko; do
              imports="$GITHUB_WORKSPACE/.work/diretta/$name.imports"
              missing="$GITHUB_WORKSPACE/.work/diretta/$name.missing"
              : > "$missing"
              while IFS= read -r symbol; do
                [[ -n "$symbol" ]] || continue
                if ! awk -v s="$symbol" '$2 == s {found=1} END {exit !found}' "$SRC/Module.symvers"; then
                  echo "$symbol" >> "$missing"
                fi
              done < "$imports"
              count="$(wc -l < "$missing")"
              missing_total=$((missing_total + count))
              echo "[$name]"
              echo "Imported symbols: $(wc -l < "$imports")"
              echo "Missing target exports: $count"
              if [[ "$count" -gt 0 ]]; then sed 's/^/  MISSING: /' "$missing"; fi
              echo
            done
            echo "Total missing imported symbols: $missing_total"
            echo "Static checks do not prove private structure layout or runtime ABI."
          } | tee "$GITHUB_WORKSPACE/diretta-v9-compatibility-report.txt"

          if [[ "$missing_total" -ne 0 ]]; then
            echo "::error::Diretta module imports are missing from target kernel/module exports."
            exit 1
          fi

      - name: Package kernel7.img, initramfs7, DTB and matching modules
        shell: bash
        run: |
          set -Eeuo pipefail
          PKG="$GITHUB_WORKSPACE/package"
          MODDIR="$PKG/lib/modules/$KERNEL_RELEASE"
          INITROOT="$GITHUB_WORKSPACE/.work/initramfs-root"
          mkdir -p "$PKG/boot" "$PKG/build-info" "$MODDIR/extra/diretta" \
            "$INITROOT/usr/lib/modules"

          install -m 0644 "$SRC/arch/arm/boot/zImage" "$PKG/boot/kernel7.img"
          install -m 0644 "$SRC/arch/arm/boot/dts/bcm2836-rpi-2-b.dtb" \
            "$PKG/boot/bcm2836-rpi-2-b.dtb"

          make -C "$SRC" ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" \
            INSTALL_MOD_PATH="$PKG" modules_install
          rm -f "$MODDIR/build" "$MODDIR/source"

          install -m 0644 modules/diretta/alsa_bridge.ko "$MODDIR/extra/diretta/"
          install -m 0644 modules/diretta/diretta_direct.ko "$MODDIR/extra/diretta/"
          depmod -b "$PKG" "$KERNEL_RELEASE"
          test -s "$MODDIR/modules.dep"
          test -s "$MODDIR/modules.alias"

          # The SD/MMC, partition parser and ext4 path are built-in. initramfs7
          # carries this exact release's modules; it intentionally has no /init.
          cp -a "$MODDIR" "$INITROOT/usr/lib/modules/$KERNEL_RELEASE"
          (
            cd "$INITROOT"
            find . -print0 | LC_ALL=C sort -z \
              | cpio --null --create --format=newc --owner=0:0
          ) | gzip -1n > "$PKG/boot/initramfs7"

          test -s "$PKG/boot/initramfs7"
          gzip -t "$PKG/boot/initramfs7"
          gzip -dc "$PKG/boot/initramfs7" | cpio -it \
            > "$PKG/build-info/initramfs7.contents.txt"
          grep -Fq "usr/lib/modules/$KERNEL_RELEASE/" \
            "$PKG/build-info/initramfs7.contents.txt"
          grep -Fq "extra/diretta/alsa_bridge.ko" \
            "$PKG/build-info/initramfs7.contents.txt"
          grep -Fq "extra/diretta/diretta_direct.ko" \
            "$PKG/build-info/initramfs7.contents.txt"

          # Keep existing overlays/settings and explicitly select V9 boot files.
          python3 - "$GITHUB_WORKSPACE/rpi-boot/config.txt" "$PKG/boot/config.txt" <<'PY'
          import sys
          from pathlib import Path
          src, dst = map(Path, sys.argv[1:])
          lines = src.read_text().splitlines()
          out = []
          for line in lines:
              s = line.strip()
              if s.startswith(("kernel=", "device_tree=", "initramfs ", "auto_initramfs=")):
                  continue
              out.append(line)
          out += [
              "",
              "[all]",
              "kernel=kernel7.img",
              "device_tree=bcm2836-rpi-2-b.dtb",
              "auto_initramfs=0",
              "initramfs initramfs7 followkernel",
              "",
          ]
          dst.write_text("\n".join(out))
          PY
          install -m 0644 rpi-boot/cmdline.txt "$PKG/boot/cmdline.txt"

          install -m 0644 "$SRC/.config" "$PKG/build-info/v9-final.config"
          install -m 0644 "$SRC/Module.symvers" "$PKG/build-info/Module.symvers"
          install -m 0644 "$GITHUB_WORKSPACE/a20-original-Module.symvers" "$PKG/build-info/"
          install -m 0644 "$SRC/System.map" "$PKG/build-info/System.map"
          install -m 0644 "$SRC/vmlinux" "$PKG/build-info/vmlinux"
          install -m 0644 "$GITHUB_WORKSPACE/$HARDWARE_CONFIG" "$PKG/build-info/"
          install -m 0644 "$GITHUB_WORKSPACE/$ABI_FRAGMENT" "$PKG/build-info/"
          for f in v9-config-audit.txt v9-driver-audit.txt v9-module-inventory.txt \
            diretta-v9-compatibility-report.txt fedora-source-provenance.txt \
            srpm-identification.txt; do
            install -m 0644 "$GITHUB_WORKSPACE/$f" "$PKG/build-info/"
          done

          cat > "$PKG/README.txt" <<EOF
          Raspberry Pi 2 Model B / Fedora 36 / Diretta kernel V9
          Kernel release: $KERNEL_RELEASE
          Source: Fedora 36 kernel SRPM 6.2.15-100 + Fedora patchset
          Hardware base: $HARDWARE_CONFIG
          ABI fragment: $ABI_FRAGMENT

          Boot files:
            boot/kernel7.img
            boot/initramfs7
            boot/bcm2836-rpi-2-b.dtb
            boot/config.txt
            boot/cmdline.txt

          Modules:
            lib/modules/$KERNEL_RELEASE/

          Original Diretta modules are included unchanged:
            lib/modules/$KERNEL_RELEASE/extra/diretta/alsa_bridge.ko
            lib/modules/$KERNEL_RELEASE/extra/diretta/diretta_direct.ko

          initramfs7 is a gzip-compressed newc archive containing this exact
          kernel release's modules under /usr/lib/modules/$KERNEL_RELEASE.
          It has no /init userspace. The kernel mounts the ext4 PARTUUID root
          directly because SD/MMC, partition parsing and ext4 are built-in.

          cmdline.txt is copied unchanged. Verify its root PARTUUID matches
          the Fedora 36 SD card before installation.

          Mandatory ABI gates: CONFIG_MODVERSIONS disabled; both original
          module vermagic strings match exactly; __check_object_size,
          fortify_panic and page_address are zero-CRC EXPORT_SYMBOL entries.

          Static checks do not guarantee runtime ABI. Back up the SD card
          before testing boot, Ethernet, USB Audio and both Diretta modules.
          EOF

          (cd "$PKG" && find boot lib -type f -print0 | sort -z | xargs -0 sha256sum) \
            > "$PKG/build-info/PACKAGE-SHA256SUMS.txt"
          cd "$GITHUB_WORKSPACE"
          tar -czf "rpi2b-fedora36-kernel-$KERNEL_RELEASE-v9.tar.gz" package
          sha256sum "rpi2b-fedora36-kernel-$KERNEL_RELEASE-v9.tar.gz" \
            > "rpi2b-fedora36-kernel-$KERNEL_RELEASE-v9.tar.gz.sha256"

      - name: Upload V9 package and audit reports
