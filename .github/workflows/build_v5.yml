name: Build Fedora 6.2.15 ARMv7 kernel with Diretta modules (v5)

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Parallel build jobs (0 = auto)"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: fedora-6.2.15-armv7-diretta-v5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Fedora SRPM 6.2.15 / Pi 2 + Pi 3 ARMv7
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      RELEASE_TAG: "6.2.15"
      SRPM_NAME: "kernel-6.2.15-100.fc36.src.rpm"
      SRPM_SHA256: "f2f2fef31c54111720782b7867bc727d4f67866864a0e54c9dab9c606737f570"
      SOURCE_NAME: "linux-6.2.15.tar.xz"
      SOURCE_SHA256: "bc2d24c3a8bba92f92f3b480381fe7c80bb85d694fda656a1e030f55b926c766"
      EXPECTED_RELEASE: "6.2.15-215.fc36.armv7hl"
      EXPECTED_VERMAGIC: "6.2.15-215.fc36.armv7hl SMP preempt mod_unload ARMv7 p2v8"
      ARCH: arm
      CROSS_COMPILE: arm-linux-gnueabihf-

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate repository inputs and original Diretta modules
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s sources/kernel-srpm/MANIFEST.txt
          test -s sources/kernel-srpm/SHA256SUMS
          test -s sources/kernel-srpm/kernel.spec
          test -s sources/kernel-srpm/kernel-armv7hl-fedora.config
          test -s sources/kernel-srpm/patch-6.2-redhat.patch
          test -s modules/diretta/alsa_bridge.ko
          test -s modules/diretta/diretta_direct.ko
          (cd modules/diretta && sha256sum -c SHA256SUMS)
          for f in modules/diretta/alsa_bridge.ko modules/diretta/diretta_direct.ko; do
            v="$(modinfo -F vermagic "$f" | xargs)"
            [[ "$v" == "$EXPECTED_VERMAGIC" ]] || {
              echo "::error::Unexpected original module vermagic for $f: $v"
              exit 1
            }
            readelf -h "$f" | grep -q 'Class:.*ELF32'
            readelf -h "$f" | grep -q 'Machine:.*ARM'
            if readelf -S "$f" | grep -q '__versions'; then
              echo "::error::$f contains __versions; this workflow expects the recorded no-MODVERSIONS module ABI."
              exit 1
            fi
          done
          mkdir -p .work/diretta
          for f in modules/diretta/*.ko; do
            b="$(basename "$f")"
            nm -u "$f" | awk '$1 == "U" {print $2}' | sort -u > ".work/diretta/$b.undefined"
            modinfo -F depends "$f" > ".work/diretta/$b.depends"
          done
          cp modules/diretta/SHA256SUMS .work/diretta/original.sha256

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl device-tree-compiler dwarves flex gcc-arm-linux-gnueabihf git kmod libelf-dev libssl-dev make rpm2cpio rsync xz-utils zstd binutils-arm-linux-gnueabihf
          arm-linux-gnueabihf-gcc --version | head -n 1

      - name: Download and verify repository Release 6.2.15 sources
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .work/download .work/srpm
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          curl -fL --retry 3 "$base/$SRPM_NAME" -o ".work/download/$SRPM_NAME"
          curl -fL --retry 3 "$base/$SOURCE_NAME" -o ".work/download/$SOURCE_NAME"
          echo "$SRPM_SHA256  .work/download/$SRPM_NAME" | sha256sum -c -
          echo "$SOURCE_SHA256  .work/download/$SOURCE_NAME" | sha256sum -c -
          rpm2cpio ".work/download/$SRPM_NAME" | (cd .work/srpm && cpio -idm --quiet)
          find .work/srpm -type f | sort > .work/srpm-files.txt
          test -s .work/srpm-files.txt
          find .work/srpm -type f -name kernel.spec -print -quit | grep -q .
          find .work/srpm -type f -name kernel-armv7hl-fedora.config -print -quit | grep -q .
          find .work/srpm -type f -name patch-6.2-redhat.patch -print -quit | grep -q .
          echo "SRPM extracted; source and SRPM checksums verified."

      - name: Prepare Fedora kernel source and apply Fedora patchset
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .work/kernel
          tar -xJf ".work/download/$SOURCE_NAME" -C .work/kernel
          src="$GITHUB_WORKSPACE/.work/kernel/linux-6.2.15"
          test -f "$src/Makefile"
          test "$(awk -F ' = ' '/^VERSION =/{v=$2} /^PATCHLEVEL =/{p=$2} /^SUBLEVEL =/{s=$2} END{print v "." p "." s}' "$src/Makefile")" = "6.2.15"

          srpm_spec="$(find .work/srpm -type f -name kernel.spec -print -quit)"
          srpm_config="$(find .work/srpm -type f -name kernel-armv7hl-fedora.config -print -quit)"
          srpm_patch="$(find .work/srpm -type f -name patch-6.2-redhat.patch -print -quit)"
          srpm_makefile="$(find .work/srpm -type f -name Makefile.rhelver -print -quit)"
          test -n "$srpm_spec" && test -n "$srpm_config" && test -n "$srpm_patch" && test -n "$srpm_makefile"

          cp "$srpm_config" "$GITHUB_WORKSPACE/.work/fedora-armv7hl.config"
          cp "$srpm_spec" "$GITHUB_WORKSPACE/.work/kernel.spec"
          cp "$srpm_patch" "$GITHUB_WORKSPACE/.work/patch-6.2-redhat.patch"
          cp "$srpm_makefile" "$src/Makefile.rhelver"

          # Match the Fedora SRPM %prep semantics: apply its declared Red Hat
          # patch to the exact linux-6.2.15 source archive, never to RPi Git.
          cd "$src"
          git init -q
          git config user.email build@localhost
          git config user.name "GitHub Actions"
          git add -A
          git -c core.autocrlf=false apply --check "$GITHUB_WORKSPACE/.work/patch-6.2-redhat.patch"
          git -c core.autocrlf=false apply "$GITHUB_WORKSPACE/.work/patch-6.2-redhat.patch"
          touch .scmversion
          printf '%s\n' "Fedora SRPM: $SRPM_NAME" "Source archive: $SOURCE_NAME" "Fedora patch: patch-6.2-redhat.patch" > "$GITHUB_WORKSPACE/.work/source-provenance.txt"
          git diff --stat | tee "$GITHUB_WORKSPACE/.work/fedora-patch-stat.txt"

      - name: Generate official Pi 2/3 reference defconfig from the Fedora-patched source
        shell: bash
        run: |
          set -Eeuo pipefail
          src="$GITHUB_WORKSPACE/.work/kernel/linux-6.2.15"
          ref="$GITHUB_WORKSPACE/.work/rpi2709-reference"
          mkdir -p "$ref"
          # Official Raspberry Pi 32-bit Pi 2/Pi 3 baseline is bcm2709_defconfig.
          # Generate it from THIS exact Fedora-patched 6.2.15 tree, not from
          # raspberrypi/linux and not from a different kernel release.
          make -C "$src" O="$ref" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" bcm2709_defconfig
          test -s "$ref/.config"
          grep -q '^CONFIG_ARCH_BCM2835=y' "$ref/.config"
          grep -q '^CONFIG_SMP=y' "$ref/.config"
          cp "$ref/.config" "$GITHUB_WORKSPACE/.work/bcm2709-reference.config"
          cp "$src/arch/arm/configs/bcm2709_defconfig" "$GITHUB_WORKSPACE/.work/bcm2709_defconfig.source"
          {
            echo "Official RPi defconfig: arch/arm/configs/bcm2709_defconfig"
            echo "Generated using the Fedora SRPM-patched Linux 6.2.15 source tree."
            echo "Reference config is used as a hardware feature delta only."
            echo "Fedora ARMv7 config remains the base for module ABI preservation."
          } > "$GITHUB_WORKSPACE/.work/rpi-config-provenance.txt"

      - name: Configure Fedora ARMv7 ABI baseline with official Pi 2/3 hardware delta
        shell: bash
        run: |
          set -Eeuo pipefail
          src="$GITHUB_WORKSPACE/.work/kernel/linux-6.2.15"
          cd "$src"
          cp "$GITHUB_WORKSPACE/.work/fedora-armv7hl.config" .config

          # Build a selective delta from the official bcm2709_defconfig generated
          # above. Do NOT merge the entire bcm2709 config: that would replace
          # many Fedora ABI-relevant choices (PREEMPT, SMP, module/signing,
          # security and compiler/runtime options).
          python3 - "$GITHUB_WORKSPACE/.work/bcm2709-reference.config" "$GITHUB_WORKSPACE/.work/fedora-armv7hl.config" "$GITHUB_WORKSPACE/.work/rpi-hardware.fragment" <<'PY'
          import re, sys
          ref_path, fedora_path, out_path = sys.argv[1:]
          ref = {}
          fedora = {}
          pat = re.compile(r'^(CONFIG_[A-Z0-9_]+)=(.*)$')
          unset = re.compile(r'^# (CONFIG_[A-Z0-9_]+) is not set$')
          for path, dst in ((ref_path, ref), (fedora_path, fedora)):
              for line in open(path, encoding="utf-8"):
                  m = pat.match(line)
                  if m:
                      dst[m.group(1)] = m.group(2)
                      continue
                  m = unset.match(line)
                  if m:
                      dst[m.group(1)] = "n"
          # Keep the delta focused on Pi platform and its common onboard buses,
          # boot/storage, networking, display, sound and hardware control.
          prefixes = (
              "ARCH_BCM", "BCM283", "BCM270", "MMC", "SDHCI", "USB",
              "MUSB", "DWC", "PHY", "PINCTRL", "GPIO", "I2C", "SPI",
              "PWM", "THERMAL", "WATCHDOG", "SERIAL_AMBA_PL011",
              "TTYAMA", "SND_BCM", "SND_SOC_BCM", "SND_SOC_SIMPLE",
              "REGULATOR", "COMMON_CLK", "CLK_BCM", "MAILBOX",
              "RASPBERRYPI", "VCHIQ", "FB_BCM", "DRM", "FRAMEBUFFER",
              "EXT4_FS", "BLK_DEV_INITRD", "RD_GZIP", "DEVTMPFS",
              "DEVTMPFS_MOUNT", "FAT_FS", "VFAT_FS", "NLS_CODEPAGE",
              "NLS_ISO8859", "NLS_UTF8", "NET", "INET", "IP_PNP",
              "ROOT_NFS", "NFS_FS", "NFS_V4"
          )
          selected = []
          for key, value in sorted(ref.items()):
              if not key.startswith("CONFIG_"):
                  continue
              name = key[len("CONFIG_"):]
              if not name.startswith(prefixes):
                  continue
              if value == "n" or fedora.get(key) == value:
                  continue
              selected.append((key, value))
          with open(out_path, "w", encoding="utf-8") as f:
              f.write("# Selective hardware delta from bcm2709_defconfig on Fedora-patched 6.2.15.\n")
              for key, value in selected:
                  f.write(f"{key}={value}\n" if value != "n" else f"# {key} is not set\n")
          print(f"Selected {len(selected)} Pi hardware config differences")
          PY
          cp "$GITHUB_WORKSPACE/.work/rpi-hardware.fragment" "$GITHUB_WORKSPACE/rpi2-rpi3-hardware.fragment"
          scripts/kconfig/merge_config.sh -m .config "$GITHUB_WORKSPACE/.work/rpi-hardware.fragment"

          # Explicit boot and root-filesystem requirements for this package.
          cat > "$GITHUB_WORKSPACE/.work/boot-storage.fragment" <<'EOF'
          CONFIG_MMC=y
          CONFIG_MMC_BLOCK=y
          CONFIG_MMC_BCM2835=y
          CONFIG_EXT4_FS=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_BLK_DEV_INITRD=y
          CONFIG_RD_GZIP=y
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          EOF
          scripts/kconfig/merge_config.sh -m .config "$GITHUB_WORKSPACE/.work/boot-storage.fragment"

          # Preserve the original Diretta vermagic and its no-CRC module model.
          scripts/config --file .config --set-str LOCALVERSION "" --disable LOCALVERSION_AUTO --disable MODVERSIONS --disable MODULE_SIG_FORCE
          sed -i 's/^EXTRAVERSION.*/EXTRAVERSION = -215.fc36.armv7hl/' Makefile
          make ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" olddefconfig
          make ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" syncconfig

          actual="$(make -s ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" kernelrelease)"
          echo "Kernel release: $actual"
          [[ "$actual" == "$EXPECTED_RELEASE" ]] || {
            echo "::error::Expected $EXPECTED_RELEASE, got $actual"
            exit 1
          }
          for sym in CONFIG_ARCH_BCM2835 CONFIG_BCM2835_MBOX CONFIG_MMC CONFIG_MMC_BLOCK CONFIG_MMC_BCM2835 CONFIG_EXT4_FS CONFIG_BLK_DEV_INITRD CONFIG_RD_GZIP CONFIG_MODULES CONFIG_MODULE_UNLOAD CONFIG_SMP; do
            grep -Eq "^$sym=(y|m)$" .config || {
              echo "::error::Required Pi/Fedora config absent after olddefconfig: $sym"
              exit 1
            }
          done
          grep -q '^CONFIG_MODVERSIONS=y' .config && {
            echo "::error::CONFIG_MODVERSIONS must remain disabled for these original vendor modules."
            exit 1
          }
          # Verify the final Pi platform essentials against the generated
          # official defconfig rather than assuming the hand-written fragment.
          for sym in CONFIG_ARCH_BCM2835 CONFIG_BCM2835_MBOX CONFIG_MMC_BCM2835 CONFIG_USB_DWCOTG CONFIG_PINCTRL_BCM2835 CONFIG_SERIAL_AMBA_PL011; do
            refval="$(grep -E "^$sym=" "$GITHUB_WORKSPACE/.work/bcm2709-reference.config" | tail -n1 || true)"
            finalval="$(grep -E "^$sym=" .config | tail -n1 || true)"
            if [[ -n "$refval" && "$refval" == *"=y" && "$finalval" != "$refval" ]]; then
              echo "::error::Final config lost official Pi setting $sym ($refval)"
              exit 1
            fi
          done
          cp .config "$GITHUB_WORKSPACE/fedora-armv7-rpi-v5.config"
          cp .config "$GITHUB_WORKSPACE/.work/final.config"
          echo "KERNEL_RELEASE=$actual" >> "$GITHUB_ENV"

      - name: Build Fedora-derived ARMv7 kernel, modules and DTBs
        shell: bash
        env:
          BUILD_JOBS: ${{ inputs.jobs }}
        run: |
          set -Eeuo pipefail
          jobs="$BUILD_JOBS"
          [[ "$jobs" =~ ^[0-9]+$ ]] || { echo "::error::jobs must be numeric"; exit 1; }
          [[ "$jobs" != "0" ]] || jobs="$(nproc)"
          src="$GITHUB_WORKSPACE/.work/kernel/linux-6.2.15"
          make -C "$src" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" -j"$jobs" zImage modules dtbs
          test -s "$src/arch/arm/boot/zImage"
          test -s "$src/Module.symvers"
          test -s "$src/System.map"
          for dtb in bcm2836-rpi-2-b.dtb bcm2837-rpi-3-b.dtb; do
            test -s "$src/arch/arm/boot/dts/$dtb" || {
              echo "::error::Expected DTB missing from Fedora source tree: $dtb"
              exit 1
            }
          done

      - name: Diretta static ABI gate
        shell: bash
        run: |
          set -Eeuo pipefail
          src="$GITHUB_WORKSPACE/.work/kernel/linux-6.2.15"
          cd "$src"
          sample="$(find . -type f -name '*.ko' -print -quit)"
          test -n "$sample"
          built_vermagic="$(modinfo -F vermagic "$sample" | xargs)"
          [[ "$built_vermagic" == "$EXPECTED_VERMAGIC" ]] || {
            echo "::error::Built module vermagic mismatch: $built_vermagic"
            exit 1
          }

          missing=0
          for module in "$GITHUB_WORKSPACE"/modules/diretta/*.ko; do
            name="$(basename "$module")"
            while IFS= read -r symbol; do
              [[ -n "$symbol" ]] || continue
              row="$(awk -v s="$symbol" '$2 == s {print; exit}' Module.symvers)"
              if [[ -z "$row" ]]; then
                echo "::error::$name imports symbol not exported by kernel/modules: $symbol"
                missing=$((missing + 1))
                continue
              fi
              export_type="$(awk -v s="$symbol" '$2 == s {print $4; exit}' Module.symvers)"
              if [[ "$export_type" == "EXPORT_SYMBOL_GPL" ]]; then
                license="$(modinfo -F license "$module" | tr -d '\r')"
                case "$license" in
                  *GPL*|*BSD*) ;;
                  *) echo "::error::$name may not import GPL-only symbol $symbol with license $license"; missing=$((missing + 1));;
                esac
              fi
            done < "$GITHUB_WORKSPACE/.work/diretta/$name.undefined"
          done
          [[ "$missing" -eq 0 ]] || exit 1

          # Report config and source provenance; static checks do not prove runtime ABI.
          sha256sum "$GITHUB_WORKSPACE"/modules/diretta/*.ko
          readelf -A "$GITHUB_WORKSPACE/modules/diretta/alsa_bridge.ko" > "$GITHUB_WORKSPACE/.work/diretta/alsa_bridge.attributes.txt"
          readelf -A "$GITHUB_WORKSPACE/modules/diretta/diretta_direct.ko" > "$GITHUB_WORKSPACE/.work/diretta/diretta_direct.attributes.txt"
          cp Module.symvers "$GITHUB_WORKSPACE/.work/Module.symvers"

      - name: Build static ARMv7 initramfs
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$GITHUB_WORKSPACE/.work/initramfs"
          root="$work/root"
          mkdir -p "$root"/{bin,dev,proc,sys,newroot}
          git clone --depth 1 --branch 1_36_1 https://git.busybox.net/busybox "$work/busybox"
          cd "$work/busybox"
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- defconfig
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          # Required initramfs applets, including PARTUUID lookup.
          for opt in BLKID SWITCH_ROOT MOUNT UMOUNT SLEEP MDEV; do
            sed -i "s/^# CONFIG_${opt} is not set/CONFIG_${opt}=y/" .config
          done
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- olddefconfig
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -j"$(nproc)"
          install -m 0755 busybox "$root/bin/busybox"
          arm-linux-gnueabihf-readelf -h "$root/bin/busybox" | grep -q 'Class:.*ELF32'
          if arm-linux-gnueabihf-readelf -l "$root/bin/busybox" | grep -q INTERP; then
            echo "::error::BusyBox is dynamically linked; initramfs requires a static binary."
            exit 1
          fi
          for app in sh mount umount mkdir sleep mdev switch_root cat sed tr; do ln -sf busybox "$root/bin/$app"; done
          cat > "$root/init" <<'INIT'
          #!/bin/sh
          export PATH=/bin
          mount -t devtmpfs devtmpfs /dev 2>/dev/null || true
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          cmdline="$(cat /proc/cmdline)"
          rootarg=""
          rootfstype="ext4"
          rootwait=0
          rootdelay=0
          for arg in $cmdline; do
            case "$arg" in
              root=*) rootarg="${arg#root=}" ;;
              rootfstype=*) rootfstype="${arg#rootfstype=}" ;;
              rootwait) rootwait=1 ;;
              rootdelay=*) rootdelay="${arg#rootdelay=}" ;;
            esac
          done
          case "$rootdelay" in ''|*[!0-9]*) rootdelay=0;; esac
          sleep "$rootdelay"
          elapsed=0
          while :; do
            dev=""
            case "$rootarg" in
              /dev/*) [ -b "$rootarg" ] && dev="$rootarg" ;;
              PARTUUID=*)
                wanted="${rootarg#PARTUUID=}"
                for sysdev in /sys/class/block/*; do
                  [ -e "$sysdev/partition" ] || continue
                  dev="/dev/${sysdev##*/}"
                  uuid="$(/bin/busybox blkid -s PARTUUID -o value "$dev" 2>/dev/null || true)"
                  [ -n "$uuid" ] && [ "$(echo "$uuid" | tr '[:upper:]' '[:lower:]')" = "$(echo "$wanted" | tr '[:upper:]' '[:lower:]')" ] && break
                  dev=""
                done ;;
            esac
            [ -n "$dev" ] && break
            [ "$rootwait" = "0" ] && [ "$elapsed" -ge 30 ] && break
            sleep 1
            elapsed=$((elapsed + 1))
          done
          if [ -z "$dev" ]; then echo "initramfs: cannot resolve root=$rootarg"; exec sh; fi
          mkdir -p /newroot
          mount -t "$rootfstype" -o rw "$dev" /newroot || { echo "initramfs: mount failed"; exec sh; }
          if [ -x /newroot/sbin/init ]; then nextinit=/sbin/init
          elif [ -x /newroot/lib/systemd/systemd ]; then nextinit=/lib/systemd/systemd
          else echo "initramfs: no init found"; exec sh; fi
          exec switch_root /newroot "$nextinit"
          INIT
          chmod 0755 "$root/init"
          (cd "$root" && find . -print0 | cpio --null -o -H newc --owner=0:0 | gzip -9) > "$GITHUB_WORKSPACE/.work/initramfs7"
          test -s "$GITHUB_WORKSPACE/.work/initramfs7"

      - name: Package kernel, DTBs, modules, initramfs and provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          pkg="$GITHUB_WORKSPACE/package"
          src="$GITHUB_WORKSPACE/.work/kernel/linux-6.2.15"
          mkdir -p "$pkg/boot/overlays" "$pkg/lib/modules" "$pkg/lib/modules/$KERNEL_RELEASE/extra/diretta" "$pkg/build-info"
          install -m 0644 "$src/arch/arm/boot/zImage" "$pkg/boot/kernel7.img"
          install -m 0644 "$GITHUB_WORKSPACE/.work/initramfs7" "$pkg/boot/initramfs7"
          find "$src/arch/arm/boot/dts" -maxdepth 1 -type f -name '*.dtb' -exec cp -t "$pkg/boot/" {} +
          if [ -d "$src/arch/arm/boot/dts/overlays" ]; then
            find "$src/arch/arm/boot/dts/overlays" -maxdepth 1 -type f \( -name '*.dtbo' -o -name README \) -exec cp -t "$pkg/boot/overlays/" {} +
          fi
          make -C "$src" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" INSTALL_MOD_PATH="$pkg" modules_install
          rm -f "$pkg/lib/modules/$KERNEL_RELEASE/build" "$pkg/lib/modules/$KERNEL_RELEASE/source"
          install -m 0644 modules/diretta/alsa_bridge.ko "$pkg/lib/modules/$KERNEL_RELEASE/extra/diretta/"
          install -m 0644 modules/diretta/diretta_direct.ko "$pkg/lib/modules/$KERNEL_RELEASE/extra/diretta/"
          depmod -b "$pkg" "$KERNEL_RELEASE"
          install -m 0644 "$src/.config" "$pkg/build-info/kernel.config"
          install -m 0644 "$src/Module.symvers" "$pkg/build-info/Module.symvers"
          install -m 0644 "$src/System.map" "$pkg/build-info/System.map"
          cp .work/source-provenance.txt "$pkg/build-info/"
          cp .work/fedora-patch-stat.txt "$pkg/build-info/"
          cp .work/diretta/original.sha256 "$pkg/build-info/diretta-original.sha256"
          cp .work/diretta/*.attributes.txt "$pkg/build-info/"
          cp .work/diretta/*.depends "$pkg/build-info/"
          cp .work/diretta/*.undefined "$pkg/build-info/"
          cat > "$pkg/README.txt" <<EOF
          Fedora SRPM-derived Linux kernel for Raspberry Pi 2 / Pi 3 (ARMv7)
          Kernel release: $KERNEL_RELEASE
          Source: Release 6.2.15 asset linux-6.2.15.tar.xz
          SRPM: $SRPM_NAME
          Fedora patch: patch-6.2-redhat.patch
          Base config: kernel-armv7hl-fedora.config plus Raspberry Pi platform fragment
          Kernel image: boot/kernel7.img
          Initramfs: boot/initramfs7
          DTBs: boot/*.dtb
          Modules: lib/modules/$KERNEL_RELEASE/
          Diretta modules: lib/modules/$KERNEL_RELEASE/extra/diretta/
          Original Diretta module bytes are preserved and SHA256-verified.
          Static symbol/vermagic checks are not proof of runtime ABI compatibility.
          Test on the target Pi 2 / Pi 3 before deployment.
          EOF
          tar -czf "fedora-armv7-diretta-$KERNEL_RELEASE.tar.gz" -C "$GITHUB_WORKSPACE" package
          sha256sum "fedora-armv7-diretta-$KERNEL_RELEASE.tar.gz" > "fedora-armv7-diretta-$KERNEL_RELEASE.tar.gz.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fedora-armv7-diretta-v5-${{ env.KERNEL_RELEASE }}
          if-no-files-found: error
          retention-days: 30
          path: |
            fedora-armv7-diretta-${{ env.KERNEL_RELEASE }}.tar.gz
            fedora-armv7-diretta-${{ env.KERNEL_RELEASE }}.tar.gz.sha256
            fedora-armv7-rpi-v5.config
            package/README.txt
            package/boot/initramfs7
            package/boot/*.dtb
