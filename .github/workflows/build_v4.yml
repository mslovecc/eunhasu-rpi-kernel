name: V7 - Build Raspberry Pi 2 Kernel from Fedora 6.2.15 SRPM

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Parallel build jobs (0 = auto)"
        required: false
        default: "0"
        type: string

      verify_diretta_symbols:
        description: "Fail if Diretta imports are missing from Module.symvers"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: fedora-srpm-rpi2-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: V7 / Fedora 6.2.15 / Raspberry Pi 2 / Diretta
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      RELEASE_TAG: "6.2.15"
      SRPM_NAME: "kernel-6.2.15-100.fc36.src.rpm"
      SOURCE_TARBALL: "linux-6.2.15.tar.xz"

      SRPM_SHA256: "f2f2fef31c54111720782b7867bc727d4f67866864a0e54c9dab9c606737f570"
      SOURCE_SHA256: "bc2d24c3a8bba92f92f3b480381fe7c80bb85d694fda656a1e030f55b926c766"

      SUPPORT_DIR: "sources/kernel-srpm"
      ABI_FRAGMENT: "config/rpi2-a20-preserved.fragment"

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --------------------------------------------------
      # 2. Install dependencies
      # --------------------------------------------------

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            cpio \
            curl \
            device-tree-compiler \
            dwarves \
            flex \
            gcc-arm-linux-gnueabihf \
            git \
            kmod \
            libelf-dev \
            libssl-dev \
            make \
            patch \
            python3 \
            rpm \
            rsync \
            xz-utils \
            binutils-arm-linux-gnueabihf

          arm-linux-gnueabihf-gcc --version | head -n 1
          gcc --version | head -n 1

          echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 3. Validate repository support files
      # --------------------------------------------------

      - name: Validate repository support files
        shell: bash
        run: |
          set -Eeuo pipefail

          for f in \
            "$SUPPORT_DIR/kernel.spec" \
            "$SUPPORT_DIR/patch-6.2-redhat.patch" \
            "$SUPPORT_DIR/kernel-armv7hl-fedora.config" \
            "$SUPPORT_DIR/SHA256SUMS" \
            "$ABI_FRAGMENT" \
            "modules/diretta/alsa_bridge.ko" \
            "modules/diretta/diretta_direct.ko"; do

            test -s "$f" || {
              echo "::error::Missing or empty file: $f"
              exit 1
            }
          done

          (
            cd "$SUPPORT_DIR"
            sha256sum --check SHA256SUMS
          )

          ALSA_VERMAGIC="$(
            modinfo -F vermagic modules/diretta/alsa_bridge.ko | xargs
          )"

          DIRECT_VERMAGIC="$(
            modinfo -F vermagic modules/diretta/diretta_direct.ko | xargs
          )"

          echo "ALSA vermagic: $ALSA_VERMAGIC"
          echo "Direct vermagic: $DIRECT_VERMAGIC"

          if [[ "$ALSA_VERMAGIC" != "$DIRECT_VERMAGIC" ]]; then
            echo "::error::Original Diretta modules have different vermagic."
            exit 1
          fi

          KERNEL_RELEASE="${ALSA_VERMAGIC%% *}"

          if [[ "$KERNEL_RELEASE" != 6.2.15-* ]]; then
            echo "::error::Original module release is not based on Linux 6.2.15."
            exit 1
          fi

          echo "EXPECTED_VERMAGIC=$ALSA_VERMAGIC" >> "$GITHUB_ENV"
          echo "KERNEL_RELEASE=$KERNEL_RELEASE" >> "$GITHUB_ENV"

          echo "Target kernel release: $KERNEL_RELEASE"

          # Verify original modules are ARM ELF files.

          for module in modules/diretta/*.ko; do
            readelf -h "$module" | grep -q 'Class:.*ELF32'
            readelf -h "$module" | grep -q 'Machine:.*ARM'
          done

          mkdir -p .work/diretta

          # Record undefined symbols imported by original modules.

          for module in modules/diretta/*.ko; do
            name="$(basename "$module")"

            arm-linux-gnueabihf-nm -u "$module" 2>/dev/null \
              | awk '$1 == "U" {print $2}' \
              | sort -u \
              > ".work/diretta/$name.undefined"
          done

          echo
          echo "Original Diretta module checksums:"

          sha256sum modules/diretta/*.ko

      # --------------------------------------------------
      # 4. Download Fedora SRPM and source archive
      # --------------------------------------------------

      - name: Download Fedora SRPM and Linux source
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p .work/downloads

          BASE_URL="https://s2.bravo123.top"

          curl -fL --retry 5 --retry-all-errors \
            "$BASE_URL/$SRPM_NAME" \
            -o ".work/downloads/$SRPM_NAME"

          curl -fL --retry 5 --retry-all-errors \
            "$BASE_URL/$SOURCE_TARBALL" \
            -o ".work/downloads/$SOURCE_TARBALL"

          echo "$SRPM_SHA256  .work/downloads/$SRPM_NAME" \
            | sha256sum --check -

          echo "$SOURCE_SHA256  .work/downloads/$SOURCE_TARBALL" \
            | sha256sum --check -

          rpm -qp --qf '%{NAME} %{VERSION}-%{RELEASE}\n' \
            ".work/downloads/$SRPM_NAME" \
            | tee .work/srpm-identification.txt

          grep -qx 'kernel 6.2.15-100.fc36' \
            .work/srpm-identification.txt

      # --------------------------------------------------
      # 5. Extract SRPM
      # --------------------------------------------------

      - name: Extract and verify SRPM payload
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p .work/srpm-payload

          (
            cd .work/srpm-payload
            rpm2cpio "../downloads/$SRPM_NAME" | cpio -idm --quiet
          )

          SPEC="$(
            find .work/srpm-payload -name kernel.spec -type f -print -quit
          )"

          PATCH="$(
            find .work/srpm-payload -name patch-6.2-redhat.patch -type f -print -quit
          )"

          CONFIG="$(
            find .work/srpm-payload -name kernel-armv7hl-fedora.config -type f -print -quit
          )"

          test -n "$SPEC"
          test -n "$PATCH"
          test -n "$CONFIG"

          cmp "$SPEC" "$SUPPORT_DIR/kernel.spec"
          cmp "$PATCH" "$SUPPORT_DIR/patch-6.2-redhat.patch"
          cmp "$CONFIG" "$SUPPORT_DIR/kernel-armv7hl-fedora.config"

          echo "SRPM payload verified against repository support files."

      # --------------------------------------------------
      # 6. Extract Linux source
      # --------------------------------------------------

      - name: Extract Linux 6.2.15 source
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p .work/source

          tar -xJf ".work/downloads/$SOURCE_TARBALL" \
            -C .work/source

          SRC="$GITHUB_WORKSPACE/.work/source/linux-6.2.15"

          test -s "$SRC/Makefile"
          test -s "$SRC/arch/arm/configs/bcm2835_defconfig"
          test -s "$SRC/arch/arm/boot/dts/bcm2836-rpi-2-b.dts"

          VERSION="$(
            make -s -C "$SRC" ARCH=arm kernelversion
          )"

          if [[ "$VERSION" != "6.2.15" ]]; then
            echo "::error::Unexpected kernel source version: $VERSION"
            exit 1
          fi

          echo "SRC=$SRC" >> "$GITHUB_ENV"

          echo "Linux source version: $VERSION"

      # --------------------------------------------------
      # 7. Apply Fedora patch and restore Makefile.rhelver
      # --------------------------------------------------

      - name: Apply Fedora kernel patch
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo " APPLY FEDORA KERNEL PATCH"
          echo "========================================"

          # Apply Fedora patch.

          patch \
            --directory="$SRC" \
            --strip=1 \
            --forward \
            < .work/srpm-payload/patch-6.2-redhat.patch

          echo "Fedora patch applied."

          # Locate Makefile.rhelver from extracted SRPM.

          RHELVER_FILE="$(
            find .work/srpm-payload \
              -type f \
              -name Makefile.rhelver \
              -print \
              -quit
          )"

          if [[ -z "$RHELVER_FILE" || ! -s "$RHELVER_FILE" ]]; then
            echo "::error::Makefile.rhelver missing from Fedora SRPM payload."
            exit 1
          fi

          # Restore the Fedora-specific Makefile include.

          install -m 0644 \
            "$RHELVER_FILE" \
            "$SRC/Makefile.rhelver"

          # Verify the file.

          test -s "$SRC/Makefile.rhelver"

          echo
          echo "[Makefile.rhelver]"

          ls -l "$SRC/Makefile.rhelver"

          sha256sum \
            "$RHELVER_FILE" \
            "$SRC/Makefile.rhelver"

          cmp \
            "$RHELVER_FILE" \
            "$SRC/Makefile.rhelver"

          # Verify top-level Makefile references it.

          grep -n 'Makefile.rhelver' "$SRC/Makefile"

          echo
          echo "Fedora Makefile preparation passed."
          
      # --------------------------------------------------
      # 8. Configure Raspberry Pi 2
      # --------------------------------------------------

      - name: Configure Raspberry Pi 2 kernel (v3)
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$SRC"

          echo "========================================"
          echo " RASPBERRY PI 2 KERNEL CONFIGURATION"
          echo "========================================"

          VERSION_PREFIX="6.2.15"

          LOCAL_SUFFIX="${KERNEL_RELEASE#${VERSION_PREFIX}}"

          if [[ "$LOCAL_SUFFIX" != "-215.fc36.armv7hl" ]]; then
            echo "::error::Unexpected LOCALVERSION suffix: $LOCAL_SUFFIX"
            exit 1
          fi

          # ----------------------------------------------
          # 8.1 Verify source version
          # ----------------------------------------------

          SOURCE_VERSION="$(
            make -s ARCH=arm kernelversion
          )"

          echo "Source version: $SOURCE_VERSION"

          if [[ "$SOURCE_VERSION" != "6.2.15" ]]; then
            echo "::error::Unexpected kernel source version."
            exit 1
          fi

          # ----------------------------------------------
          # 8.2 Generate bcm2835_defconfig
          # ----------------------------------------------

          make ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" \
            bcm2835_defconfig

          # ----------------------------------------------
          # 8.3 Merge A20 ABI configuration
          # ----------------------------------------------

          test -s "$GITHUB_WORKSPACE/$ABI_FRAGMENT"

          bash scripts/kconfig/merge_config.sh \
            -m -r \
            .config \
            "$GITHUB_WORKSPACE/$ABI_FRAGMENT"

          # ----------------------------------------------
          # 8.4 Configure kernel options
          # ----------------------------------------------

          scripts/config --file .config \
            --set-str LOCALVERSION "" \
            --disable LOCALVERSION_AUTO \
            --disable ARCH_MULTI_V6 \
            --enable ARCH_MULTI_V7 \
            --disable CPU_32v6 \
            --enable CPU_32v7 \
            --enable ARCH_BCM2835 \
            --enable CPU_V7 \
            --enable AEABI \
            --enable SMP \
            --enable PREEMPT \
            --enable MODULES \
            --enable MODULE_UNLOAD \
            --enable FRAME_POINTER \
            --disable PREEMPT_RT \
            --disable THUMB2_KERNEL \
            --enable BLK_DEV_INITRD \
            --enable RD_GZIP \
            --enable MODULE_COMPRESS_XZ \
            --enable DEVTMPFS \
            --enable DEVTMPFS_MOUNT \
            --enable MMC \
            --enable MMC_BLOCK \
            --enable BLOCK \
            --enable MMC_BCM2835 \
            --enable MSDOS_PARTITION \
            --enable EXT4_FS \
            --enable USB_STORAGE \
            --enable BINFMT_ELF \
            --enable BINFMT_SCRIPT \
            --enable VFP \
            --enable VFPv3 \
            --enable NEON \
            --enable USB \
            --enable USB_DWC2 \
            --enable USB_DWC2_HOST \
            --enable SERIAL_AMBA_PL011 \
            --enable SERIAL_AMBA_PL011_CONSOLE \
            --module SQUASHFS \
            --module OVERLAY_FS \
            --module BLK_DEV_LOOP \
            --module SND \
            --module SND_PCM \
            --module SND_TIMER \
            --module SND_USB_AUDIO \
            --module SND_SOC

          # ----------------------------------------------
          # 8.5 Synchronize Kconfig
          # ----------------------------------------------

          make ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" \
            olddefconfig

          make ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" \
            syncconfig

          echo
          echo "===== Raspberry Pi 2 boot-critical configuration ====="

          for sym in \
            CONFIG_BLOCK=y \
            CONFIG_MMC=y \
            CONFIG_MMC_BLOCK=y \
            CONFIG_MMC_BCM2835=y \
            CONFIG_MSDOS_PARTITION=y \
            CONFIG_EXT4_FS=y \
            CONFIG_BLK_DEV_INITRD=y \
            CONFIG_RD_GZIP=y \
            CONFIG_MODULE_COMPRESS_XZ=y \
            CONFIG_DEVTMPFS=y \
            CONFIG_DEVTMPFS_MOUNT=y \
            CONFIG_BINFMT_ELF=y \
            CONFIG_BINFMT_SCRIPT=y \
            CONFIG_VFP=y \
            CONFIG_VFPv3=y \
            CONFIG_NEON=y \
            CONFIG_USB_DWC2=y \
            CONFIG_USB_DWC2_HOST=y \
            CONFIG_USB_STORAGE=y; do

            if ! grep -qx "$sym" .config; then
              echo "::error::Required boot/module configuration missing: $sym"
              exit 1
            fi

            echo "OK: $sym"
          done

          echo
          echo "===== A20 required configuration validation ====="

            for sym in \
              CONFIG_HARDENED_USERCOPY \
              CONFIG_FORTIFY_SOURCE \
              CONFIG_HIGHMEM; do

              if ! grep -qx "${sym}=y" .config; then
                echo "::error::Required A20 configuration missing: $sym"
                exit 1
              fi

              echo "OK: ${sym}=y"
            done
            
          # ----------------------------------------------
          # 8.5.1 Enforce ARMv7-only configuration
          # ----------------------------------------------

          echo
          echo "[ARMv7 configuration validation]"

          grep -E \
            '^(CONFIG_ARCH_MULTI_V[0-9]+|CONFIG_CPU_32v[0-9]+|CONFIG_CPU_V[0-9]+)=' \
            .config || true

          if ! grep -qx 'CONFIG_ARCH_MULTI_V7=y' .config; then
            echo "::error::CONFIG_ARCH_MULTI_V7 is not enabled."
            exit 1
          fi

          if ! grep -qx 'CONFIG_CPU_32v7=y' .config; then
            echo "::error::CONFIG_CPU_32v7 is not enabled."
            exit 1
          fi

          if grep -qE '^(CONFIG_ARCH_MULTI_V6|CONFIG_CPU_32v6)=' .config; then
            echo "::error::ARMv6 configuration is still enabled."
            exit 1
          fi

          echo "ARMv7-only configuration passed."

          # ----------------------------------------------
          # 8.6 Set localversion file
          #
          # Do not rely on CONFIG_LOCALVERSION.
          # Keep CONFIG_LOCALVERSION empty.
          # Kbuild reads the localversion file.
          # ----------------------------------------------

          printf '%s\n' "$LOCAL_SUFFIX" > localversion

          echo
          echo "localversion file:"
          cat localversion

          # ----------------------------------------------
          # 8.7 Verify .config
          # ----------------------------------------------

          echo
          echo "[CONFIG LOCALVERSION]"

          grep -E '^(CONFIG_LOCALVERSION=|# CONFIG_LOCALVERSION)' \
            .config || true

          CONFIG_LOCALVERSION="$(
            sed -n 's/^CONFIG_LOCALVERSION="\(.*\)"$/\1/p' .config
          )"

          if [[ -n "$CONFIG_LOCALVERSION" ]]; then
            echo "::error::CONFIG_LOCALVERSION must be empty."
            exit 1
          fi

          # ----------------------------------------------
          # 8.8 Verify auto.conf
          # ----------------------------------------------

          echo
          echo "[AUTO.CONF LOCALVERSION]"

          grep -E '^CONFIG_LOCALVERSION=' \
            include/config/auto.conf || true

          # ----------------------------------------------
          # 8.9 Verify setlocalversion
          # ----------------------------------------------

          echo
          echo "[SETLOCALVERSION]"

          SETLOCALVERSION_OUTPUT="$(
            bash scripts/setlocalversion "$SRC"
          )"

          echo "setlocalversion: $SETLOCALVERSION_OUTPUT"

          if [[ "$SETLOCALVERSION_OUTPUT" != "$LOCAL_SUFFIX" ]]; then
            echo "::error::setlocalversion output mismatch."
            echo "Expected: $LOCAL_SUFFIX"
            echo "Actual:   $SETLOCALVERSION_OUTPUT"
            exit 1
          fi

          # ----------------------------------------------
          # 8.10 Verify kernelrelease
          # ----------------------------------------------

          echo
          echo "[KERNEL RELEASE]"

          ACTUAL_RELEASE="$(
            make -s \
              ARCH=arm \
              CROSS_COMPILE="$CROSS_COMPILE" \
              kernelrelease
          )"

          echo "Expected: $KERNEL_RELEASE"
          echo "Actual:   $ACTUAL_RELEASE"

          if [[ "$ACTUAL_RELEASE" != "$KERNEL_RELEASE" ]]; then
            echo "::error::Kernel release mismatch."
            echo "Expected: $KERNEL_RELEASE"
            echo "Actual:   $ACTUAL_RELEASE"
            exit 1
          fi

          # ----------------------------------------------
          # 8.11 Save configuration
          # ----------------------------------------------

          cp .config "$GITHUB_WORKSPACE/output-rpi2.config"

          cp localversion \
            "$GITHUB_WORKSPACE/output-localversion"

          echo "KERNEL_RELEASE=$ACTUAL_RELEASE" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo " KERNEL CONFIGURATION PASSED"
          echo " Kernel: $ACTUAL_RELEASE"
          echo "========================================"

      # --------------------------------------------------
      # 8.5 Diagnose ARM architecture configuration
      # --------------------------------------------------

      - name: Diagnose ARM architecture configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$SRC"

          echo "========================================"
          echo " ARM ARCHITECTURE DIAGNOSTICS"
          echo "========================================"

          echo
          echo "[1] ARM CPU configuration"

          grep -E \
            '^(CONFIG_CPU_V[0-9]+|CONFIG_CPU_32v[0-9]+|CONFIG_ARCH_MULTI_V[0-9]+|CONFIG_THUMB2_KERNEL|CONFIG_AEABI|CONFIG_OABI_COMPAT)=' \
            .config || true

          echo
          echo "[2] Explicit unset ARM CPU configuration"

          grep -E \
            '^# CONFIG_(CPU_V[0-9]+|CPU_32v[0-9]+|ARCH_MULTI_V[0-9]+) is not set' \
            .config || true

          echo
          echo "[3] Compiler target"

          "${CROSS_COMPILE}gcc" -dumpmachine
          "${CROSS_COMPILE}gcc" -dumpversion

          echo
          echo "[4] Compiler ARM architecture macros"

          "${CROSS_COMPILE}gcc" -dM -E -x c /dev/null \
            | grep -E '__ARM_ARCH|__ARM_ARCH_ISA|__thumb__|__thumb2__' \
            | sort || true

          echo
          echo "[5] Kernel ARM architecture selection"

          grep -n '__LINUX_ARM_ARCH__' \
            arch/arm/Makefile \
            arch/arm/include/asm/vermagic.h || true

          echo
          echo "[6] Current kernel release"

          make -s ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" \
            kernelrelease

          echo
          echo "ARM diagnostics completed."

      # --------------------------------------------------
      # 9. Build kernel
      # --------------------------------------------------

      - name: Build zImage modules and DTBs
        shell: bash
        env:
          BUILD_JOBS: ${{ inputs.jobs }}
        run: |
          set -Eeuo pipefail

          JOBS="$BUILD_JOBS"

          if [[ -z "$JOBS" || "$JOBS" == "0" ]]; then
            JOBS="$(nproc)"
          fi

          if ! [[ "$JOBS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid build job count."
            exit 1
          fi

          echo "Build jobs: $JOBS"

          make -C "$SRC" \
            ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" \
            -j"$JOBS" \
            zImage modules dtbs

          test -s "$SRC/arch/arm/boot/zImage"
          test -s "$SRC/arch/arm/boot/dts/bcm2836-rpi-2-b.dtb"
          test -s "$SRC/Module.symvers"
          test -s "$SRC/System.map"

          # Audit the actual output module architecture, not only the config.
          SAMPLE_BUILT_KO="$(find "$SRC" -type f -name '*.ko' -print -quit)"
          test -n "$SAMPLE_BUILT_KO"
          readelf -h "$SAMPLE_BUILT_KO" | grep -q 'Class:.*ELF32'
          readelf -h "$SAMPLE_BUILT_KO" | grep -q 'Machine:.*ARM'
          readelf -A "$SAMPLE_BUILT_KO" | grep -q 'Tag_CPU_arch: v7'
          echo "Built kernel module is ARMv7 ELF32."

          # The upstream Pi 2 DTB enables BCM2835 SDHOST (not Arasan SDHCI).
          # The driver must be built-in so the kernel can resolve root=PARTUUID
          # and mount the SD root filesystem before starting its /sbin/init.
          grep -qx 'CONFIG_MMC_BCM2835=y' "$SRC/.config"
          grep -Fqx 'kernel/drivers/mmc/host/bcm2835.ko' "$SRC/modules.builtin"

          DTB="$SRC/arch/arm/boot/dts/bcm2836-rpi-2-b.dtb"
          SD_COMPAT="$(fdtget -t s "$DTB" /soc/mmc@7e202000 compatible)"
          SD_STATUS="$(fdtget -t s "$DTB" /soc/mmc@7e202000 status)"
          USB_COMPAT="$(fdtget -t s "$DTB" /soc/usb@7e980000 compatible)"

          [[ "$SD_COMPAT" == "brcm,bcm2835-sdhost" ]]
          [[ "$SD_STATUS" == "okay" ]]
          [[ "$USB_COMPAT" == "brcm,bcm2835-usb" ]]
          grep -qx 'CONFIG_USB_DWC2=y' "$SRC/.config"
          grep -qx 'CONFIG_USB_DWC2_HOST=y' "$SRC/.config"
          grep -Fqx 'kernel/drivers/usb/dwc2/dwc2.ko' "$SRC/modules.builtin"
          grep -qx 'CONFIG_USB_STORAGE=y' "$SRC/.config"
          grep -Fqx 'kernel/drivers/usb/storage/usb-storage.ko' "$SRC/modules.builtin"

          echo "Pi 2 DTB SDHOST and BCM2835 USB/DWC2 drivers are built-in."

      - name: Diagnose missing Diretta kernel symbols
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$SRC"

          echo "===== 1. Relevant kernel configuration ====="
          grep -E '^(CONFIG_(HARDENED_USERCOPY|FORTIFY_SOURCE|HIGHMEM|HIGHMEM4G|ARM_LPAE|ARCH_BCM2835|MODULES))=' .config || true

          echo
          echo "===== 2. Missing symbols in Module.symvers ====="
          for sym in __check_object_size fortify_panic page_address; do
            echo "--- $sym ---"
            grep -w "$sym" Module.symvers || echo "NOT FOUND"
          done

          echo
          echo "===== 3. Symbol definitions in kernel source ====="
          grep -R -n -E \
            '(__check_object_size|fortify_panic|page_address)' \
            mm include arch/arm \
            --include='*.c' --include='*.h' \
            | head -n 100 || true

          echo
          echo "===== 4. Export declarations ====="
          grep -R -n -E \
            'EXPORT_SYMBOL(_GPL)?\((__check_object_size|fortify_panic|page_address)\)' \
            mm arch/arm \
            --include='*.c' || true

          echo
          echo "===== 5. Built kernel symbols ====="
          if [[ -f vmlinux ]]; then
            nm -A vmlinux 2>/dev/null \
              | grep -E '(__check_object_size|fortify_panic|page_address)$' \
              || true
          else
            echo "vmlinux not found"
          fi

          echo
          echo "===== 6. Module.symvers metadata ====="
          ls -lh Module.symvers vmlinux 2>/dev/null || true

          echo
          echo "===== FORTIFY implementation ====="

          grep -R -n -E \
            'fortify_panic|__fortify_panic|EXPORT_SYMBOL.*fortify' \
            lib include mm \
            --include='*.c' --include='*.h' || true

          echo
          echo "===== HARDENED_USERCOPY implementation ====="

          grep -n -E \
            'HARDENED_USERCOPY|__check_object_size|EXPORT_SYMBOL' \
            mm/usercopy.c || true

          echo
          echo "===== HIGHMEM implementation ====="

          grep -n -E \
            'CONFIG_HIGHMEM|page_address|EXPORT_SYMBOL' \
            mm/highmem.c || true

      # --------------------------------------------------
      # 10. Verify vermagic and symbol coverage
      # --------------------------------------------------

      - name: Verify Diretta compatibility metadata
        shell: bash
        env:
          VERIFY_SYMBOLS: ${{ inputs.verify_diretta_symbols }}
        run: |
          set -Eeuo pipefail

          SAMPLE_KO="$(
            find "$SRC" -type f -name '*.ko' -print -quit
          )"

          test -n "$SAMPLE_KO" || {
            echo "::error::No kernel module was produced."
            exit 1
          }

          BUILT_VERMAGIC="$(
            modinfo -F vermagic "$SAMPLE_KO" | xargs
          )"

          echo "Original vermagic: $EXPECTED_VERMAGIC"
          echo "Built vermagic:    $BUILT_VERMAGIC"

          if [[ "$BUILT_VERMAGIC" != "$EXPECTED_VERMAGIC" ]]; then
            echo "::error::Built kernel module vermagic mismatch."
            exit 1
          fi

          echo
          echo "===== A20 required kernel exports validation ====="

          for sym in \
            __check_object_size \
            fortify_panic \
            page_address; do

            if ! awk -v s="$sym" \
              '$2 == s {found=1} END {exit !found}' \
              "$SRC/Module.symvers"; then

              echo "::error::Missing required A20 export: $sym"
              exit 1
            fi

            echo "OK: $sym"
          done

          echo "All required A20 kernel exports are present."

          REPORT="$GITHUB_WORKSPACE/diretta-compatibility-report.txt"

          MISSING_TOTAL=0

          {
            echo "Diretta static compatibility report"
            echo "===================================="
            echo "Kernel release: $KERNEL_RELEASE"
            echo "Original vermagic: $EXPECTED_VERMAGIC"
            echo "Built vermagic: $BUILT_VERMAGIC"
            echo

            echo "This is a static metadata and symbol-name check."
            echo "It does not prove complete binary ABI compatibility."
            echo

            for MODULE in \
              modules/diretta/alsa_bridge.ko \
              modules/diretta/diretta_direct.ko; do

              NAME="$(basename "$MODULE")"

              SYMBOL_LIST=".work/diretta/$NAME.undefined"
              MISSING_FILE=".work/diretta/$NAME.missing"

              : > "$MISSING_FILE"

              while IFS= read -r SYMBOL; do
                [[ -n "$SYMBOL" ]] || continue

                if ! awk -v s="$SYMBOL" \
                  '$2 == s {found=1} END {exit !found}' \
                  "$SRC/Module.symvers"; then

                  echo "$SYMBOL" >> "$MISSING_FILE"
                fi

              done < "$SYMBOL_LIST"

              COUNT="$(wc -l < "$MISSING_FILE")"

              MISSING_TOTAL=$((MISSING_TOTAL + COUNT))

              echo "[$NAME]"
              echo "SHA256: $(sha256sum "$MODULE" | awk '{print $1}')"
              echo "Undefined symbols: $(wc -l < "$SYMBOL_LIST")"
              echo "Missing exported symbols: $COUNT"

              if [[ "$COUNT" -gt 0 ]]; then
                sed 's/^/MISSING: /' "$MISSING_FILE"
              fi

              echo

            done

            echo "Total missing symbols: $MISSING_TOTAL"

          } > "$REPORT"

          cat "$REPORT"

          if [[ "$VERIFY_SYMBOLS" == "true" && "$MISSING_TOTAL" -gt 0 ]]; then
            echo "::error::Diretta imports are missing from Module.symvers."
            exit 1
          fi

      # --------------------------------------------------
      # 11. Package
      # --------------------------------------------------

      - name: Package Raspberry Pi 2 kernel
        shell: bash
        run: |
          set -Eeuo pipefail

          PKG="$GITHUB_WORKSPACE/package"

          mkdir -p \
            "$PKG/boot/overlays" \
            "$PKG/lib/modules" \
            "$PKG/build-info"

          # Kernel image

          install -m 0644 \
            "$SRC/arch/arm/boot/zImage" \
            "$PKG/boot/kernel7.img"

          # Device tree

          install -m 0644 \
            "$SRC/arch/arm/boot/dts/bcm2836-rpi-2-b.dtb" \
            "$PKG/boot/bcm2836-rpi-2-b.dtb"

          # Device tree overlays

          if compgen -G "$SRC/arch/arm/boot/dts/overlays/*.dtbo" > /dev/null; then
            cp "$SRC"/arch/arm/boot/dts/overlays/*.dtbo \
              "$PKG/boot/overlays/"
          fi

          if [[ -f "$SRC/arch/arm/boot/dts/overlays/README" ]]; then
            cp "$SRC/arch/arm/boot/dts/overlays/README" \
              "$PKG/boot/overlays/"
          fi

          # Install kernel modules

          make -C "$SRC" \
            ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" \
            INSTALL_MOD_PATH="$PKG" \
            modules_install

          rm -f \
            "$PKG/lib/modules/$KERNEL_RELEASE/build" \
            "$PKG/lib/modules/$KERNEL_RELEASE/source"

          depmod -b "$PKG" "$KERNEL_RELEASE"

          # Build a module-only initramfs matching this exact kernel release.
          #
          # V7 intentionally does NOT include /init, systemd, bash, or any
          # host userspace. With no /init, Linux 6.2 executes prepare_namespace:
          # it resolves root=PARTUUID in-kernel, mounts the ext4 rootfs, then
          # starts /sbin/init from the real root filesystem. This is the
          # simplest and safest design for this SD-root Pi 2 target.
          #
          # modules_install uses CONFIG_MODULE_COMPRESS_XZ to create .ko.xz.
          INITRD_ROOT="$GITHUB_WORKSPACE/.work/initramfs-root"
          INITRD_CPIO="$GITHUB_WORKSPACE/.work/initramfs7.cpio"

          rm -rf "$INITRD_ROOT"
          install -d "$INITRD_ROOT/usr/lib/modules"

          cp -a "$PKG/lib/modules/$KERNEL_RELEASE" \
            "$INITRD_ROOT/usr/lib/modules/"

          MODULE_DIR="$PKG/lib/modules/$KERNEL_RELEASE"
          XZ_MODULE_COUNT="$(find "$MODULE_DIR" -type f -name '*.ko.xz' | wc -l)"
          PLAIN_MODULE_COUNT="$(find "$MODULE_DIR" -type f -name '*.ko' | wc -l)"

          if [[ "$XZ_MODULE_COUNT" -eq 0 || "$PLAIN_MODULE_COUNT" -ne 0 ]]; then
            echo "::error::Expected XZ-compressed modules only; .ko.xz=$XZ_MODULE_COUNT, plain .ko=$PLAIN_MODULE_COUNT"
            exit 1
          fi

          echo "XZ-compressed kernel modules: $XZ_MODULE_COUNT"

          # No build/source symlink may leak into the initramfs.
          if find "$INITRD_ROOT" -type l -print -quit | grep -q .; then
            echo "::error::Symlink found in module-only initramfs."
            find "$INITRD_ROOT" -type l -print
            exit 1
          fi

          # There must be no executable file, shell, systemd, /init, or ELF
          # userspace binary in this archive. Kernel modules are XZ-compressed.
          if find "$INITRD_ROOT" -type f -perm /111 -print -quit | grep -q .; then
            echo "::error::Executable file found in module-only initramfs."
            find "$INITRD_ROOT" -type f -perm /111 -print
            exit 1
          fi

          while IFS= read -r -d '' candidate; do
            if readelf -h "$candidate" >/dev/null 2>&1; then
              echo "::error::Unexpected uncompressed ELF in initramfs: $candidate"
              exit 1
            fi
          done < <(find "$INITRD_ROOT" -type f -print0)

          (
            cd "$INITRD_ROOT"
            find . -print0 | LC_ALL=C sort -z \
              | cpio --null --create --format=newc --owner=0:0
          ) > "$INITRD_CPIO"

          test -s "$INITRD_CPIO"

          # gzip -n removes timestamps and original filename for reproducibility.
          gzip -9 -n -c "$INITRD_CPIO" > "$PKG/boot/initramfs7"
          test -s "$PKG/boot/initramfs7"

          # Validate the outer compression and the inner CPIO archive.
          gzip -t "$PKG/boot/initramfs7"
          gzip -dc "$PKG/boot/initramfs7" \
            | cpio -it --quiet \
            > "$PKG/build-info/initramfs7.contents.txt"

          grep -Fq "usr/lib/modules/$KERNEL_RELEASE/" \
            "$PKG/build-info/initramfs7.contents.txt"

          if grep -Eq '(^|/)(init|sbin/init|bin/sh|bash|systemd)$' \
            "$PKG/build-info/initramfs7.contents.txt"; then
            echo "::error::Unexpected userspace init path in module-only initramfs7."
            exit 1
          fi

          if grep -Eq '(^|/)(bin|sbin|usr/bin|usr/sbin|usr/lib/systemd)(/|$)' \
            "$PKG/build-info/initramfs7.contents.txt"; then
            echo "::error::Userspace directory found in module-only initramfs7."
            exit 1
          fi

          # Confirm the initramfs itself contains compressed modules.
          grep -Eq "usr/lib/modules/$KERNEL_RELEASE/.+\\.ko\\.xz$" \
            "$PKG/build-info/initramfs7.contents.txt"

          echo
          echo "===== V7 initramfs architecture/scope audit ====="
          echo "Archive contains modules only; no /init and no ELF userspace."
          file "$INITRD_CPIO" "$PKG/boot/initramfs7"
          ls -lh "$INITRD_CPIO" "$PKG/boot/initramfs7"

          (
            cd "$PKG/boot"
            sha256sum initramfs7
          ) | tee "$PKG/build-info/initramfs7.sha256"

          rm -f "$INITRD_CPIO"

          # Build information

          install -m 0644 "$SRC/.config" \
            "$PKG/build-info/rpi2.config"

          install -m 0644 "$SRC/System.map" \
            "$PKG/build-info/System.map"

          install -m 0644 "$SRC/Module.symvers" \
            "$PKG/build-info/Module.symvers"

          cp .work/srpm-identification.txt \
            "$PKG/build-info/"

          cp diretta-compatibility-report.txt \
            "$PKG/build-info/"

          cp "$GITHUB_WORKSPACE/output-localversion" \
            "$PKG/build-info/localversion"

          # Package README

          cat > "$PKG/README.txt" <<EOF
          Raspberry Pi 2 Model B kernel package

          Kernel version: $KERNEL_RELEASE
          Source: Fedora 6.2.15 SRPM
          SRPM: $SRPM_NAME

          Kernel image:
          boot/kernel7.img

          Device tree:
          boot/bcm2836-rpi-2-b.dtb

          Initramfs:
          boot/initramfs7 (gzip-compressed newc CPIO, modules only)
          No /init, shell, systemd, or ELF userspace is included.
          Linux resolves root=PARTUUID itself, mounts the ext4 rootfs, then
          starts /sbin/init from that real root filesystem.
          Kernel modules inside initramfs are XZ-compressed (.ko.xz).

          Kernel modules:
          lib/modules/$KERNEL_RELEASE/

          Build method:
          Fedora Linux 6.2.15 source archive
          Fedora patch-6.2-redhat.patch
          Raspberry Pi 2 bcm2835_defconfig
          Project A20 ABI configuration fragment

          V7 BOOT DESIGN:
          Pi 2 DTB enables brcm,bcm2835-sdhost; CONFIG_MMC_BCM2835 is built-in.
          DOS PARTUUID and ext4 root mounting are handled by the kernel.
          BCM2835 USB uses the upstream DWC2 host driver, built into this kernel.
          ARMv7 VFPv3/NEON support is enabled and audited in the final config.

          IMPORTANT:
          This is not a byte-for-byte reproduction of the SOtM A20 kernel.
          Original Diretta modules are not modified.
          Static vermagic and symbol checks do not guarantee runtime ABI compatibility.
          Raspberry Pi boot firmware and root filesystem are not included.
          EOF

          # Create archive

          cd "$GITHUB_WORKSPACE"

          tar -czf \
            "rpi2-kernel-v7-$KERNEL_RELEASE.tar.gz" \
            -C "$GITHUB_WORKSPACE" package

          sha256sum \
            "rpi2-kernel-v7-$KERNEL_RELEASE.tar.gz" \
            > "rpi2-kernel-v7-$KERNEL_RELEASE.tar.gz.sha256"

          echo "Package created:"
          ls -lh \
            "rpi2-kernel-v7-$KERNEL_RELEASE.tar.gz" \
            "rpi2-kernel-v7-$KERNEL_RELEASE.tar.gz.sha256"

      # --------------------------------------------------
      # 12. Upload artifacts
      # --------------------------------------------------

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpi2-kernel-v7-${{ env.KERNEL_RELEASE }}
          if-no-files-found: error
          retention-days: 30
          path: |
            rpi2-kernel-v7-${{ env.KERNEL_RELEASE }}.tar.gz
            rpi2-kernel-v7-${{ env.KERNEL_RELEASE }}.tar.gz.sha256
            output-rpi2.config
            output-localversion
            diretta-compatibility-report.txt
            package/README.txt
            package/build-info/**
